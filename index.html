<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALUVENTUM® – Gruppen-Test · Startseite</title>
<style>html,body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}.vv-loading{min-height:100vh;display:grid;place-items:center;color:#0f5a46;font-weight:800}</style>
</head>
<body>
<div class="vv-loading">VALUVENTUM® wird geladen …</div>
<script>
(async function(){
  try{
    const response=await fetch('./startseite-original.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Startseite konnte nicht geladen werden.');
    let html=await response.text();
    const addition='\n<script src="valuventum-budget.js?v=2"><'+'/script>\n';
    if(/<\/body\s*>/i.test(html)) html=html.replace(/<\/body\s*>/i,addition+'</body>');
    else html+=addition;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="padding:32px;font-family:Arial,sans-serif;color:#0f5a46"><h1>VALUVENTUM®</h1><p>Die Startseite konnte nicht geladen werden. Bitte die Seite neu laden.</p></div>';
  }
})();
</script>
</body>
</html>
