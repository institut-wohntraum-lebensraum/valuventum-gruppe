<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALUVENTUM® DEZENTRAL – Das Instrument der Freiheit</title>
<meta name="description" content="VALUVENTUM® Gruppen-Testversion – Original-Startbereich mit neuer Budget- und Verteilungsrechnung.">
<style>
html,body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}
#vv-loading{min-height:100vh;display:grid;place-items:center;color:#0f5a46;font-weight:850}
#vv-budget-slot{background:#fff}
</style>
</head>
<body>
<div id="vv-loading">VALUVENTUM® wird geladen …</div>
<div id="vv-page" hidden></div>

<script>
(async function(){
  const loading=document.getElementById('vv-loading');
  const page=document.getElementById('vv-page');
  try{
    const r=await fetch('./startseite-original.html?v=original-top-1',{cache:'no-store'});
    if(!r.ok) throw new Error('Original-Startseite konnte nicht geladen werden.');
    const source=await r.text();
    const doc=new DOMParser().parseFromString(source,'text/html');

    /* Exakt die vorhandenen Styles der ursprünglichen Startseite übernehmen. */
    doc.head.querySelectorAll('style').forEach(oldStyle=>{
      const style=document.createElement('style');
      if(oldStyle.id) style.id='vv-original-'+oldStyle.id;
      style.textContent=oldStyle.textContent;
      document.head.appendChild(style);
    });

    const originalHeader=doc.querySelector('header.vv-header');
    const startRoute=doc.querySelector('.vv-route[data-route="startseite"]');
    const originalHero=startRoute && startRoute.querySelector('section.hero');
    const originalStats=startRoute && startRoute.querySelector('section.stats');

    if(!originalHero || !originalStats) throw new Error('Der obere Originalbereich wurde nicht gefunden.');

    /* Nur: Original-Kopf + Original-Hero + vier Original-Kennzahlen. */
    if(originalHeader) page.appendChild(originalHeader.cloneNode(true));

    const main=document.createElement('main');
    const hero=originalHero.cloneNode(true);
    const stats=originalStats.cloneNode(true);

    /* Unterseiten gibt es im Gruppentest nicht: die beiden sichtbaren Tasten führen zur neuen Rechnung. */
    hero.querySelectorAll('.cta-row a').forEach(a=>a.setAttribute('href','#vv-budget-distribution'));

    main.appendChild(hero);
    main.appendChild(stats);

    const slot=document.createElement('div');
    slot.id='vv-budget-slot';
    main.appendChild(slot);
    page.appendChild(main);

    /* Kleine Sprachsteuerung nur für den übernommenen oberen Originalbereich. */
    const text={
      de:{
        eyebrow:'VALUVENTUM® DEZENTRAL · Menschen · Werte · Gemeinschaft · Zukunft',
        title:'Ein Instrument für <span>Freiheit</span>.',
        lead:'VALUVENTUM® ist ein global gedachtes Gemeinschaftsmodell, das wirtschaftlichen Fluss, Transparenz und ein bedingungsloses Grundeinkommen miteinander verbindet.',
        status:'<strong>Gruppen-Testversion:</strong> Nur die VALUVENTUM®-Startseite ist freigegeben. Die Rechner und Eingabefelder auf dieser Seite dienen zum Lernen, Prüfen und Ausprobieren.',
        cta1:'Modell ansehen',cta2:'Projekt unterstützen',
        s1:'Menschen weltweit',s2:'pro Mensch und Monat',s3:'jährlicher Modellbedarf',s4:'Gemeinschaftsbeitrag im Modell',
        home:'Startseite',badge:'GRUPPENTEST · NUR STARTSEITE'
      },
      en:{
        eyebrow:'VALUVENTUM® DECENTRALISED · People · Values · Community · Future',
        title:'An instrument for <span>freedom</span>.',
        lead:'VALUVENTUM® is a globally conceived community model combining economic flow, transparency and an unconditional basic income.',
        status:'<strong>Group test version:</strong> Only the VALUVENTUM® home page is enabled. The calculators and input fields on this page are for learning, testing and understanding.',
        cta1:'View model',cta2:'Support project',
        s1:'people worldwide',s2:'per person and month',s3:'annual model requirement',s4:'community contribution in the model',
        home:'Home',badge:'GROUP TEST · HOME PAGE ONLY'
      },
      es:{
        eyebrow:'VALUVENTUM® DESCENTRAL · Personas · Valores · Comunidad · Futuro',
        title:'Un instrumento para la <span>libertad</span>.',
        lead:'VALUVENTUM® es un modelo comunitario de alcance global que combina flujo económico, transparencia y una renta básica incondicional.',
        status:'<strong>Versión de prueba grupal:</strong> Solo está habilitada la página de inicio de VALUVENTUM®. Las calculadoras y los campos de entrada sirven para aprender, comprobar y comprender.',
        cta1:'Ver modelo',cta2:'Apoyar proyecto',
        s1:'personas en el mundo',s2:'por persona y mes',s3:'necesidad anual del modelo',s4:'aportación comunitaria en el modelo',
        home:'Inicio',badge:'PRUEBA DE GRUPO · SOLO INICIO'
      }
    };

    function setLang(lang){
      if(!text[lang]) lang='de';
      document.documentElement.lang=lang;
      const t=text[lang];
      const q=(sel)=>page.querySelector(sel);
      const eyebrow=q('.hero [data-i18n="eyebrow"]'); if(eyebrow) eyebrow.textContent=t.eyebrow;
      const title=q('.hero [data-i18n="title"]'); if(title) title.innerHTML=t.title;
      const lead=q('.hero [data-i18n="lead"]'); if(lead) lead.textContent=t.lead;
      const status=q('.hero .decentral-status'); if(status) status.innerHTML=t.status;
      const cta1=q('.hero [data-i18n="cta1"]'); if(cta1) cta1.textContent=t.cta1;
      const cta2=q('.hero [data-i18n="cta2"]'); if(cta2) cta2.textContent=t.cta2;
      ['s1','s2','s3','s4'].forEach(k=>{const el=q('.stats [data-i18n="'+k+'"]');if(el)el.textContent=t[k];});
      const home=q('.vv-nav .vv-link'); if(home) home.textContent=t.home;
      const badge=q('.vv-group-badge'); if(badge) badge.textContent=t.badge;
      page.querySelectorAll('.vv-lang button[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
      document.dispatchEvent(new CustomEvent('valuventum:language',{detail:{lang}}));
    }

    page.querySelectorAll('.vv-lang button[data-lang]').forEach(btn=>{
      btn.addEventListener('click',e=>{e.preventDefault();setLang(btn.dataset.lang);});
    });

    /* Alte Navigation/Unterseiten bleiben im Gruppentest unsichtbar; nur Startseite, Badge und Sprache. */
    const nav=page.querySelector('.vv-nav');
    if(nav){
      Array.from(nav.children).forEach(el=>{
        if(!(el.classList.contains('vv-current') || el.classList.contains('vv-group-badge'))) el.remove();
      });
    }
    const mobile=page.querySelector('.vv-mobile-btn'); if(mobile) mobile.remove();
    const mobilePanel=page.querySelector('.vv-mobile-panel'); if(mobilePanel) mobilePanel.remove();
    page.querySelectorAll('.vv-actions > :not(.vv-lang)').forEach(el=>el.remove());

    loading.remove();
    page.hidden=false;
    setLang('de');

    /* Direkt nach den vier Original-Kennzahlen beginnt die neue Budgetverteilung. */
    const budgetScript=document.createElement('script');
    budgetScript.src='./valuventum-budget.js?v=original-top-1';
    slot.appendChild(budgetScript);
  }catch(err){
    loading.innerHTML='<div style="padding:32px;text-align:center"><h1 style="color:#0f5a46">VALUVENTUM®</h1><p>Die Startseite konnte nicht geladen werden.</p><small>'+String(err.message||err)+'</small></div>';
  }
})();
</script>
</body>
</html>
