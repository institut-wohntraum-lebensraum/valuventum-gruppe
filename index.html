<script>
(async function(){
  const loading=document.getElementById('vv-loading');
  const page=document.getElementById('vv-page');
  try{
    const r=await fetch('./startseite-original.html?v=original-top-6',{cache:'no-store'});
    if(!r.ok) throw new Error('Original-Startseite konnte nicht geladen werden.');
    const source=await r.text();
    const doc=new DOMParser().parseFromString(source,'text/html');
    doc.head.querySelectorAll('style').forEach(oldStyle=>{const style=document.createElement('style');if(oldStyle.id) style.id='vv-original-'+oldStyle.id;style.textContent=oldStyle.textContent;document.head.appendChild(style);});
    const originalHeader=doc.querySelector('header.vv-header');
    const startRoute=doc.querySelector('.vv-route[data-route="startseite"]');
    const originalHero=startRoute && startRoute.querySelector('section.hero');
    const originalStats=startRoute && startRoute.querySelector('section.stats');
    if(!originalHero || !originalStats) throw new Error('Der obere Originalbereich wurde nicht gefunden.');
    if(originalHeader) page.appendChild(originalHeader.cloneNode(true));
    const main=document.createElement('main');
    const hero=originalHero.cloneNode(true);
    const stats=originalStats.cloneNode(true);
    hero.querySelectorAll('.cta-row a').forEach(a=>a.setAttribute('href','#vv-basic-income'));
    main.appendChild(hero);main.appendChild(stats);

    const explain=document.createElement('section');
    explain.className='vv-explain';
    explain.innerHTML=`
      <div class="vv-kicker" data-vvx="kicker">DIE NEUE RECHNUNG · MENSCHENZENTRIERT</div>
      <h2 data-vvx="title">Wie werden die 52,04 Billionen Valu jetzt verteilt?</h2>
      <p data-vvx="lead">Nicht mehr jeder Kontinent erhält denselben Betrag. Stattdessen wird jeder Mensch im Modell gleich gewichtet. Der Anteil eines Kontinents am verfügbaren Gemeinschaftsbudget richtet sich deshalb nach seinem Anteil an der Weltbevölkerung. Vor dieser Verteilung steht jedoch immer zuerst das Grundeinkommen.</p>
      <div class="vv-explain-grid">
        <div class="vv-explain-card"><b>1 · Gemeinschaftstopf</b><span data-vvx="step1">Ausgangspunkt ist eine VALUVENTUM®-Rechengröße von 2,0 Billiarden Valu pro Jahr. Bei 10 % entstehen 200 Billionen Valu Gemeinschaftstopf.</span></div>
        <div class="vv-explain-card"><b>2 · Grundeinkommen zuerst</b><span data-vvx="step2">Das Grundeinkommen wird als erster großer Ausgabeblock gerechnet. Im Basismodell sind das 1.500 Valu pro Mensch und Monat beziehungsweise 147,96 Billionen Valu pro Jahr weltweit.</span></div>
        <div class="vv-explain-card"><b>3 · Danach Gemeinschaftsaufgaben</b><span data-vvx="step3">Erst der danach verbleibende Betrag wird – nach einem globalen Puffer – menschenzentriert auf die Kontinente und anschließend auf die Aufgabenbereiche verteilt.</span></div>
      </div>
      <div class="vv-explain-result"><strong data-vvx="resultH">Die Reihenfolge ist entscheidend:</strong> <span data-vvx="resultP">Gemeinschaftstopf → Grundeinkommen → verbleibendes Gemeinschaftsbudget → Verteilung nach Menschen → Verwendung für öffentliche Aufgaben, Landwirtschaft, Gesundheit, Bildung und Reserve.</span></div>`;
    main.appendChild(explain);

    const basic=document.createElement('section');
    basic.className='vv-basic';
    basic.id='vv-basic-income';
    basic.innerHTML=`
      <div class="vv-kicker" data-vvb="kicker">GRUNDEINKOMMEN · ERSTER SCHRITT</div>
      <h2 data-vvb="title">Das Grundeinkommen steht vor der Verteilung des Restbudgets.</h2>
      <p data-vvb="lead">Im VALUVENTUM®-Basismodell wird das Grundeinkommen für alle im Modell berücksichtigten Menschen zuerst vollständig berechnet. Es ist eine direkte Leistung an die Menschen und darf nicht mit dem späteren Pro-Kopf-Verteilungsschlüssel für Gemeinschaftsaufgaben verwechselt werden.</p>
      <div class="vv-basic-grid">
        <div class="vv-basic-card"><span data-vvb="people">Menschen im Basismodell</span><b>8,22 Mrd.</b></div>
        <div class="vv-basic-card"><span data-vvb="monthly">Grundeinkommen pro Mensch / Monat</span><b>1.500 Valu</b></div>
        <div class="vv-basic-card"><span data-vvb="yearly">Grundeinkommen pro Mensch / Jahr</span><b>18.000 Valu</b></div>
        <div class="vv-basic-card total"><span data-vvb="total">Grundeinkommen weltweit / Jahr</span><b>147,96 Billionen Valu</b></div>
      </div>
      <div class="vv-basic-formula" data-vvb="formula">8,22 Mrd. Menschen × 1.500 Valu × 12 Monate = 147,96 Billionen Valu pro Jahr</div>
      <div class="vv-basic-note"><strong data-vvb="importantH">Wichtig:</strong> <span data-vvb="importantP">Die 147,96 Billionen Valu werden im Basismodell zuerst vom 200-Billionen-Gemeinschaftstopf abgezogen. Bei 10 % Gemeinschaftsbeitrag bleiben danach 52,04 Billionen Valu für Gemeinschaftsaufgaben. Der später angezeigte Pro-Kopf-Verteilungsschlüssel von rund 6.326 Valu ist keine zweite Auszahlung an die Menschen, sondern nur die Rechengröße, mit der dieses Restbudget fair nach Bevölkerung auf die Kontinente verteilt wird.</span></div>`;
    main.appendChild(basic);

    const active=document.createElement('section');
    active.className='vv-active';
    active.id='vv-active-people';
    active.innerHTML=`
      <div class="vv-kicker" data-vva="kicker">AKTIVE MENSCHEN · MODELLANNAHME</div>
      <h2 data-vva="title">Grundeinkommen bedeutet nicht, dass niemand mehr tätig sein muss.</h2>
      <p data-vva="lead">Eine funktionierende Gesellschaft braucht weiterhin Menschen, die produzieren, versorgen, pflegen, bauen, forschen, lehren, transportieren, organisieren und technische Systeme betreiben. VALUVENTUM® rechnet deshalb im Basismodell mit rund 3,5 Milliarden weiterhin aktiven Menschen. Das Grundeinkommen soll den wirtschaftlichen Zwang reduzieren – nicht notwendige Tätigkeit abschaffen.</p>
      <div class="vv-active-grid">
        <div class="vv-active-card"><span data-vva="all">Menschen im Basismodell</span><b>8,22 Mrd.</b></div>
        <div class="vv-active-card focus"><span data-vva="active">Weiterhin aktive Menschen</span><b>3,50 Mrd.</b></div>
        <div class="vv-active-card"><span data-vva="activeShare">Anteil am Basismodell</span><b>≈ 42,6 %</b></div>
        <div class="vv-active-card"><span data-vva="notRequired">Nicht zwingend wirtschaftlich aktiv</span><b>4,72 Mrd. · ≈ 57,4 %</b></div>
      </div>
      <div class="vv-active-formula" data-vva="formula">3,50 Mrd. ÷ 8,22 Mrd. = rund 42,6 % weiterhin aktive Menschen</div>
      <div class="vv-active-note"><strong data-vva="importantH">Entscheidend:</strong> <span data-vva="importantP">Die 3,5 Milliarden sind eine VALUVENTUM®-Modellannahme und kein Prozentwert des Gemeinschaftsbeitrags. Der Schieberegler von 5–15 % beschreibt den finanziellen Gemeinschaftsbeitrag auf den Modellfluss. Die 3,5 Milliarden beschreiben dagegen die angenommene Zahl der Menschen, die weiterhin aktiv an Versorgung, Wirtschaft und gesellschaftlichen Aufgaben teilnehmen. Das Grundeinkommen bleibt davon unabhängig für alle Menschen im Basismodell bestehen.</span></div>`;
    main.appendChild(active);

    const payment=document.createElement('section');
    payment.className='vv-payment';
    payment.id='vv-payment-example';
    payment.innerHTML=`
      <div class="vv-kicker" data-vvp="kicker">GEMEINSCHAFTSBEITRAG · GANZ EINFACH</div>
      <h2 data-vvp="title">Was passiert beim Bezahlen?</h2>
      <p data-vvp="lead">Stell dir vor, ein Unternehmen braucht am Ende genau 100 Valu. Wenn 10 % des gesamten Zahlbetrags in den Gemeinschaftstopf gehen sollen, muss der Kunde etwas mehr als 110 Valu bezahlen.</p>
      <div class="vv-payment-grid">
        <div class="vv-payment-card"><span data-vvp="company">Das Unternehmen soll bekommen</span><b>100 Valu</b></div>
        <div class="vv-payment-card focus"><span data-vvp="customer">Der Kunde bezahlt bei 10 %</span><b>111,11 Valu</b></div>
        <div class="vv-payment-card"><span data-vvp="community">Davon gehen in die Gemeinschaft</span><b>11,11 Valu</b></div>
      </div>
      <div class="vv-payment-formula" data-vvp="formula">100 Valu ÷ 0,90 = 111,11 Valu → 100 Valu Unternehmen + 11,11 Valu Gemeinschaft</div>
      <div class="vv-payment-note"><strong data-vvp="whyH">Warum nicht einfach 110 Valu?</strong> <span data-vvp="whyP">Bei 110 Valu wären 10 Valu nur 9,09 % vom gesamten Preis. Wenn wirklich 10 % des gesamten Zahlbetrags in die Gemeinschaft gehen sollen, muss der Gesamtpreis deshalb 111,11 Valu sein. Bei 15 % wären es 117,65 Valu: 100 Valu für das Unternehmen und 17,65 Valu für die Gemeinschaft. Dieses Beispiel erklärt die Rechenweise; welche Zahlungen später tatsächlich beitragspflichtig sind, muss im VALUVENTUM®-Modell eindeutig festgelegt werden.</span></div>`;
    main.appendChild(payment);

    const slot=document.createElement('div');slot.id='vv-budget-slot';main.appendChild(slot);page.appendChild(main);

    const text={
      de:{eyebrow:'VALUVENTUM® DEZENTRAL · Menschen · Werte · Gemeinschaft · Zukunft',title:'Ein Instrument für <span>Freiheit</span>.',lead:'VALUVENTUM® ist ein global gedachtes Gemeinschaftsmodell, das wirtschaftlichen Fluss, Transparenz und ein bedingungsloses Grundeinkommen miteinander verbindet.',status:'<strong>Gruppen-Testversion:</strong> Nur die VALUVENTUM®-Startseite ist freigegeben. Diese Seite dient zum Lernen, Prüfen und Ausprobieren.',cta1:'Modell ansehen',cta2:'Projekt unterstützen',s1:'Menschen weltweit',s2:'pro Mensch und Monat',s3:'jährlicher Modellbedarf',s4:'Gemeinschaftsbeitrag im Modell',home:'Startseite',badge:'GRUPPENTEST · NUR STARTSEITE',kicker:'DIE NEUE RECHNUNG · MENSCHENZENTRIERT',title2:'Wie werden die 52,04 Billionen Valu jetzt verteilt?',lead2:'Nicht mehr jeder Kontinent erhält denselben Betrag. Stattdessen wird jeder Mensch im Modell gleich gewichtet. Der Anteil eines Kontinents am verfügbaren Gemeinschaftsbudget richtet sich deshalb nach seinem Anteil an der Weltbevölkerung. Vor dieser Verteilung steht jedoch immer zuerst das Grundeinkommen.',step1:'Ausgangspunkt ist eine VALUVENTUM®-Rechengröße von 2,0 Billiarden Valu pro Jahr. Bei 10 % entstehen 200 Billionen Valu Gemeinschaftstopf.',step2:'Das Grundeinkommen wird als erster großer Ausgabeblock gerechnet. Im Basismodell sind das 1.500 Valu pro Mensch und Monat beziehungsweise 147,96 Billionen Valu pro Jahr weltweit.',step3:'Erst der danach verbleibende Betrag wird – nach einem globalen Puffer – menschenzentriert auf die Kontinente und anschließend auf die Aufgabenbereiche verteilt.',resultH:'Die Reihenfolge ist entscheidend:',resultP:'Gemeinschaftstopf → Grundeinkommen → verbleibendes Gemeinschaftsbudget → Verteilung nach Menschen → Verwendung für öffentliche Aufgaben, Landwirtschaft, Gesundheit, Bildung und Reserve.',basicKicker:'GRUNDEINKOMMEN · ERSTER SCHRITT',basicTitle:'Das Grundeinkommen steht vor der Verteilung des Restbudgets.',basicLead:'Im VALUVENTUM®-Basismodell wird das Grundeinkommen für alle im Modell berücksichtigten Menschen zuerst vollständig berechnet. Es ist eine direkte Leistung an die Menschen und darf nicht mit dem späteren Pro-Kopf-Verteilungsschlüssel für Gemeinschaftsaufgaben verwechselt werden.',people:'Menschen im Basismodell',monthly:'Grundeinkommen pro Mensch / Monat',yearly:'Grundeinkommen pro Mensch / Jahr',total:'Grundeinkommen weltweit / Jahr',formula:'8,22 Mrd. Menschen × 1.500 Valu × 12 Monate = 147,96 Billionen Valu pro Jahr',importantH:'Wichtig:',importantP:'Die 147,96 Billionen Valu werden im Basismodell zuerst vom 200-Billionen-Gemeinschaftstopf abgezogen. Bei 10 % Gemeinschaftsbeitrag bleiben danach 52,04 Billionen Valu für Gemeinschaftsaufgaben. Der später angezeigte Pro-Kopf-Verteilungsschlüssel von rund 6.326 Valu ist keine zweite Auszahlung an die Menschen, sondern nur die Rechengröße, mit der dieses Restbudget fair nach Bevölkerung auf die Kontinente verteilt wird.',activeKicker:'AKTIVE MENSCHEN · MODELLANNAHME',activeTitle:'Grundeinkommen bedeutet nicht, dass niemand mehr tätig sein muss.',activeLead:'Eine funktionierende Gesellschaft braucht weiterhin Menschen, die produzieren, versorgen, pflegen, bauen, forschen, lehren, transportieren, organisieren und technische Systeme betreiben. VALUVENTUM® rechnet deshalb im Basismodell mit rund 3,5 Milliarden weiterhin aktiven Menschen. Das Grundeinkommen soll den wirtschaftlichen Zwang reduzieren – nicht notwendige Tätigkeit abschaffen.',all:'Menschen im Basismodell',active:'Weiterhin aktive Menschen',activeShare:'Anteil am Basismodell',notRequired:'Nicht zwingend wirtschaftlich aktiv',activeFormula:'3,50 Mrd. ÷ 8,22 Mrd. = rund 42,6 % weiterhin aktive Menschen',activeImportantH:'Entscheidend:',activeImportantP:'Die 3,5 Milliarden sind eine VALUVENTUM®-Modellannahme und kein Prozentwert des Gemeinschaftsbeitrags. Der Schieberegler von 5–15 % beschreibt den finanziellen Gemeinschaftsbeitrag auf den Modellfluss. Die 3,5 Milliarden beschreiben dagegen die angenommene Zahl der Menschen, die weiterhin aktiv an Versorgung, Wirtschaft und gesellschaftlichen Aufgaben teilnehmen. Das Grundeinkommen bleibt davon unabhängig für alle Menschen im Basismodell bestehen.',paymentKicker:'GEMEINSCHAFTSBEITRAG · GANZ EINFACH',paymentTitle:'Was passiert beim Bezahlen?',paymentLead:'Stell dir vor, ein Unternehmen braucht am Ende genau 100 Valu. Wenn 10 % des gesamten Zahlbetrags in den Gemeinschaftstopf gehen sollen, muss der Kunde etwas mehr als 110 Valu bezahlen.',paymentCompany:'Das Unternehmen soll bekommen',paymentCustomer:'Der Kunde bezahlt bei 10 %',paymentCommunity:'Davon gehen in die Gemeinschaft',paymentFormula:'100 Valu ÷ 0,90 = 111,11 Valu → 100 Valu Unternehmen + 11,11 Valu Gemeinschaft',paymentWhyH:'Warum nicht einfach 110 Valu?',paymentWhyP:'Bei 110 Valu wären 10 Valu nur 9,09 % vom gesamten Preis. Wenn wirklich 10 % des gesamten Zahlbetrags in die Gemeinschaft gehen sollen, muss der Gesamtpreis deshalb 111,11 Valu sein. Bei 15 % wären es 117,65 Valu: 100 Valu für das Unternehmen und 17,65 Valu für die Gemeinschaft. Dieses Beispiel erklärt die Rechenweise; welche Zahlungen später tatsächlich beitragspflichtig sind, muss im VALUVENTUM®-Modell eindeutig festgelegt werden.'},
      en:{eyebrow:'VALUVENTUM® DECENTRALISED · People · Values · Community · Future',title:'An instrument for <span>freedom</span>.',lead:'VALUVENTUM® is a globally conceived community model combining economic flow, transparency and an unconditional basic income.',status:'<strong>Group test version:</strong> Only the VALUVENTUM® home page is enabled. This page is for learning, testing and understanding.',cta1:'View model',cta2:'Support project',s1:'people worldwide',s2:'per person and month',s3:'annual model requirement',s4:'community contribution in the model',home:'Home',badge:'GROUP TEST · HOME PAGE ONLY',kicker:'THE NEW CALCULATION · PEOPLE-CENTRED',title2:'How are the 52.04 trillion Valu distributed now?',lead2:'Continents no longer receive equal amounts. Every person is weighted equally. Before this distribution, however, basic income is always calculated first.',step1:'The starting point is a VALUVENTUM® calculation base of 2.0 quadrillion Valu per year. At 10%, this produces a 200 trillion Valu community pool.',step2:'Basic income is calculated as the first major expenditure block. In the base model this is 1,500 Valu per person per month, or 147.96 trillion Valu per year worldwide.',step3:'Only the remaining amount is then distributed, after a global buffer, across continents by population and across community tasks.',resultH:'The order matters:',resultP:'Community pool → basic income → remaining community budget → people-centred distribution → public tasks, agriculture, health, education and reserve.',basicKicker:'BASIC INCOME · FIRST STEP',basicTitle:'Basic income comes before distribution of the remaining budget.',basicLead:'In the VALUVENTUM® base model, basic income for all people included in the model is calculated first. It is a direct benefit to people and must not be confused with the later per-capita allocation key for community tasks.',people:'People in the base model',monthly:'Basic income per person / month',yearly:'Basic income per person / year',total:'Worldwide basic income / year',formula:'8.22 billion people × 1,500 Valu × 12 months = 147.96 trillion Valu per year',importantH:'Important:',importantP:'The 147.96 trillion Valu are deducted first from the 200 trillion Valu community pool. At a 10% contribution, 52.04 trillion Valu then remain for community tasks. The later per-capita allocation key of about 6,326 Valu is not a second payment to people; it is only the calculation value used to distribute this remaining budget fairly across continents by population.',activeKicker:'ACTIVE PEOPLE · MODEL ASSUMPTION',activeTitle:'Basic income does not mean that nobody needs to remain active.',activeLead:'A functioning society still needs people who produce, supply, care, build, research, teach, transport, organise and operate technical systems. The VALUVENTUM® base model therefore assumes around 3.5 billion people remain active. Basic income is intended to reduce economic pressure, not eliminate necessary activity.',all:'People in the base model',active:'People remaining active',activeShare:'Share of the base model',notRequired:'Not necessarily economically active',activeFormula:'3.50 billion ÷ 8.22 billion = about 42.6% remaining active',activeImportantH:'Key distinction:',activeImportantP:'The 3.5 billion figure is a VALUVENTUM® model assumption, not a percentage of the community contribution. The 5–15% slider refers to the financial contribution on the model flow. The 3.5 billion figure instead describes the assumed number of people who remain active in supply, economic and social tasks. Basic income remains independent of this and applies to all people in the base model.',paymentKicker:'COMMUNITY CONTRIBUTION · VERY SIMPLE',paymentTitle:'What happens when you pay?',paymentLead:'Imagine a company needs to end up with exactly 100 Valu. If 10% of the total payment is meant to go into the community pool, the customer has to pay a little more than 110 Valu.',paymentCompany:'The company should receive',paymentCustomer:'The customer pays at 10%',paymentCommunity:'This goes to the community',paymentFormula:'100 Valu ÷ 0.90 = 111.11 Valu → 100 Valu company + 11.11 Valu community',paymentWhyH:'Why not simply 110 Valu?',paymentWhyP:'With a total price of 110 Valu, 10 Valu is only 9.09% of the full price. If exactly 10% of the total payment is to go to the community, the total price must therefore be 111.11 Valu. At 15%, it would be 117.65 Valu: 100 Valu for the company and 17.65 Valu for the community. This example explains the calculation; the VALUVENTUM® model still needs to define clearly which payments are actually subject to the contribution.'},
      es:{eyebrow:'VALUVENTUM® DESCENTRAL · Personas · Valores · Comunidad · Futuro',title:'Un instrumento para la <span>libertad</span>.',lead:'VALUVENTUM® es un modelo comunitario de alcance global que combina flujo económico, transparencia y una renta básica incondicional.',status:'<strong>Versión de prueba grupal:</strong> Solo está habilitada la página de inicio de VALUVENTUM®. Esta página sirve para aprender, comprobar y experimentar.',cta1:'Ver modelo',cta2:'Apoyar proyecto',s1:'personas en el mundo',s2:'por persona y mes',s3:'necesidad anual del modelo',s4:'aportación comunitaria en el modelo',home:'Inicio',badge:'PRUEBA DE GRUPO · SOLO INICIO',kicker:'EL NUEVO CÁLCULO · CENTRADO EN LAS PERSONAS',title2:'¿Cómo se distribuyen ahora los 52,04 billones Valu?',lead2:'Los continentes ya no reciben la misma cantidad. Cada persona tiene el mismo peso. Sin embargo, antes de esta distribución siempre se calcula primero la renta básica.',step1:'El punto de partida es una base de cálculo VALUVENTUM® de 2,0 mil billones Valu al año. Con el 10 % se forma un fondo comunitario de 200 billones Valu.',step2:'La renta básica se calcula como primer gran bloque de gasto. En el modelo base son 1.500 Valu por persona y mes, es decir, 147,96 billones Valu al año en todo el mundo.',step3:'Solo el importe restante se distribuye después, tras un fondo global, entre los continentes según población y entre las tareas comunitarias.',resultH:'El orden es decisivo:',resultP:'Fondo comunitario → renta básica → presupuesto comunitario restante → distribución centrada en las personas → tareas públicas, agricultura, salud, educación y reserva.',basicKicker:'RENTA BÁSICA · PRIMER PASO',basicTitle:'La renta básica se calcula antes de distribuir el presupuesto restante.',basicLead:'En el modelo base VALUVENTUM®, primero se calcula completamente la renta básica para todas las personas incluidas en el modelo. Es una prestación directa a las personas y no debe confundirse con la posterior clave per cápita para tareas comunitarias.',people:'Personas en el modelo base',monthly:'Renta básica por persona / mes',yearly:'Renta básica por persona / año',total:'Renta básica mundial / año',formula:'8,22 mil millones de personas × 1.500 Valu × 12 meses = 147,96 billones Valu al año',importantH:'Importante:',importantP:'Los 147,96 billones Valu se descuentan primero del fondo comunitario de 200 billones Valu. Con una aportación del 10 %, quedan después 52,04 billones Valu para tareas comunitarias. La posterior clave per cápita de unos 6.326 Valu no es un segundo pago a las personas; es solo el valor de cálculo utilizado para distribuir este presupuesto restante de forma justa entre continentes según población.',activeKicker:'PERSONAS ACTIVAS · SUPUESTO DEL MODELO',activeTitle:'La renta básica no significa que nadie deba seguir activo.',activeLead:'Una sociedad funcional sigue necesitando personas que produzcan, abastezcan, cuiden, construyan, investiguen, enseñen, transporten, organicen y operen sistemas técnicos. Por ello, el modelo base VALUVENTUM® supone que alrededor de 3,5 mil millones de personas continúan activas. La renta básica busca reducir la presión económica, no eliminar la actividad necesaria.',all:'Personas en el modelo base',active:'Personas que siguen activas',activeShare:'Proporción del modelo base',notRequired:'No necesariamente activas económicamente',activeFormula:'3,50 mil millones ÷ 8,22 mil millones = aproximadamente 42,6 % activas',activeImportantH:'Distinción clave:',activeImportantP:'Los 3,5 mil millones son un supuesto del modelo VALUVENTUM®, no un porcentaje de la aportación comunitaria. El control del 5–15 % describe la aportación financiera sobre el flujo del modelo. Los 3,5 mil millones describen en cambio el número supuesto de personas que siguen participando activamente en tareas de abastecimiento, economía y sociedad. La renta básica permanece independiente de ello y se aplica a todas las personas del modelo base.',paymentKicker:'APORTACIÓN COMUNITARIA · MUY FÁCIL',paymentTitle:'¿Qué pasa cuando pagas?',paymentLead:'Imagina que una empresa necesita recibir exactamente 100 Valu. Si el 10 % del pago total debe ir al fondo comunitario, el cliente tiene que pagar un poco más de 110 Valu.',paymentCompany:'La empresa debe recibir',paymentCustomer:'El cliente paga con el 10 %',paymentCommunity:'Esto va a la comunidad',paymentFormula:'100 Valu ÷ 0,90 = 111,11 Valu → 100 Valu empresa + 11,11 Valu comunidad',paymentWhyH:'¿Por qué no simplemente 110 Valu?',paymentWhyP:'Con un precio total de 110 Valu, 10 Valu son solo el 9,09 % del precio completo. Si exactamente el 10 % del pago total debe ir a la comunidad, el precio total debe ser 111,11 Valu. Con el 15 %, serían 117,65 Valu: 100 Valu para la empresa y 17,65 Valu para la comunidad. Este ejemplo explica el cálculo; el modelo VALUVENTUM® todavía debe definir claramente qué pagos estarán realmente sujetos a la aportación.'}
    };

    function numberLocale(lang){return lang==='en'?'en-US':lang==='es'?'es-ES':'de-DE';}
    function parseLocalizedNumber(raw,lang){
      const s=String(raw).trim();
      if(lang==='en') return Number(s.replace(/,/g,''));
      return Number(s.replace(/\./g,'').replace(',','.'));
    }
    function magnitudeText(value,lang){
      if(!Number.isFinite(value)) return null;
      const abs=Math.abs(value);
      const sign=value<0?'- ':'';
      const nf=(n,max=3)=>new Intl.NumberFormat(numberLocale(lang),{maximumFractionDigits:max}).format(n);
      if(lang==='en'){
        if(abs>=1000) return sign+nf(abs/1000,3)+' quadrillion Valu';
        if(abs>=1) return sign+nf(abs,3)+' trillion Valu';
        return sign+nf(abs*1000,3)+' billion Valu';
      }
      if(lang==='es'){
        if(abs>=1000) return sign+nf(abs/1000,3)+' mil billones Valu';
        if(abs>=1) return sign+nf(abs,3)+' billones Valu';
        return sign+nf(abs*1000,3)+' mil millones Valu';
      }
      if(abs>=1000) return sign+nf(abs/1000,3)+' Billiarden Valu';
      if(abs>=1) return sign+nf(abs,3)+' Billionen Valu';
      return sign+nf(abs*1000,3)+' Milliarden Valu';
    }
    function normalizeMagnitudeUnits(rootNode){
      if(!rootNode) return;
      const lang=(document.documentElement.lang||'de').slice(0,2).toLowerCase();
      const flow=rootNode.querySelector && rootNode.querySelector('.flow');
      if(flow){
        const cards=flow.querySelectorAll('article b');
        if(cards[0]) cards[0].textContent=lang==='en'?'2 quadrillion Valu':lang==='es'?'2 mil billones Valu':'2 Billiarden Valu';
        if(cards[1]) cards[1].textContent=lang==='en'?'147.96 trillion Valu':lang==='es'?'147,96 billones Valu':'147,96 Billionen Valu';
      }
      const nodes=rootNode.querySelectorAll?rootNode.querySelectorAll('*'):[];
      nodes.forEach(el=>{
        if(el.children && el.children.length) return;
        const txt=(el.textContent||'').trim();
        const m=txt.match(/^(-\s*)?([0-9.,]+)\s+Bio\.\s+Valu$/i);
        if(!m) return;
        const n=parseLocalizedNumber(m[2],lang);
        const value=m[1]?-n:n;
        const replacement=magnitudeText(value,lang);
        if(replacement) el.textContent=replacement;
      });
    }

    function setLang(lang){
      if(!text[lang])lang='de';
      document.documentElement.lang=lang;
      const t=text[lang],q=s=>page.querySelector(s);
      const eyebrow=q('.hero [data-i18n="eyebrow"]');if(eyebrow)eyebrow.textContent=t.eyebrow;
      const title=q('.hero [data-i18n="title"]');if(title)title.innerHTML=t.title;
      const lead=q('.hero [data-i18n="lead"]');if(lead)lead.textContent=t.lead;
      const status=q('.hero .decentral-status');if(status)status.innerHTML=t.status;
      const cta1=q('.hero [data-i18n="cta1"]');if(cta1)cta1.textContent=t.cta1;
      const cta2=q('.hero [data-i18n="cta2"]');if(cta2)cta2.textContent=t.cta2;
      ['s1','s2','s3','s4'].forEach(k=>{const el=q('.stats [data-i18n="'+k+'"]');if(el)el.textContent=t[k];});
      const home=q('.vv-nav .vv-link');if(home)home.textContent=t.home;
      const badge=q('.vv-group-badge');if(badge)badge.textContent=t.badge;
      const map={kicker:'kicker',title:'title2',lead:'lead2',step1:'step1',step2:'step2',step3:'step3',resultH:'resultH',resultP:'resultP'};
      Object.entries(map).forEach(([key,val])=>{const el=q('[data-vvx="'+key+'"]');if(el)el.textContent=t[val];});
      const basicMap={kicker:'basicKicker',title:'basicTitle',lead:'basicLead',people:'people',monthly:'monthly',yearly:'yearly',total:'total',formula:'formula',importantH:'importantH',importantP:'importantP'};
      Object.entries(basicMap).forEach(([key,val])=>{const el=q('[data-vvb="'+key+'"]');if(el)el.textContent=t[val];});
      const activeMap={kicker:'activeKicker',title:'activeTitle',lead:'activeLead',all:'all',active:'active',activeShare:'activeShare',notRequired:'notRequired',formula:'activeFormula',importantH:'activeImportantH',importantP:'activeImportantP'};
      Object.entries(activeMap).forEach(([key,val])=>{const el=q('[data-vva="'+key+'"]');if(el)el.textContent=t[val];});
      const paymentMap={kicker:'paymentKicker',title:'paymentTitle',lead:'paymentLead',company:'paymentCompany',customer:'paymentCustomer',community:'paymentCommunity',formula:'paymentFormula',whyH:'paymentWhyH',whyP:'paymentWhyP'};
      Object.entries(paymentMap).forEach(([key,val])=>{const el=q('[data-vvp="'+key+'"]');if(el)el.textContent=t[val];});
      page.querySelectorAll('.vv-lang button[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
      normalizeMagnitudeUnits(page);
      const budgetHost=document.getElementById('vv-budget-distribution');
      if(budgetHost && budgetHost.shadowRoot) normalizeMagnitudeUnits(budgetHost.shadowRoot);
      document.dispatchEvent(new CustomEvent('valuventum:language',{detail:{lang}}));
    }

    page.querySelectorAll('.vv-lang button[data-lang]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();setLang(btn.dataset.lang);}));
    const nav=page.querySelector('.vv-nav');if(nav){Array.from(nav.children).forEach(el=>{if(!(el.classList.contains('vv-current')||el.classList.contains('vv-group-badge')))el.remove();});}
    const mobile=page.querySelector('.vv-mobile-btn');if(mobile)mobile.remove();const mobilePanel=page.querySelector('.vv-mobile-panel');if(mobilePanel)mobilePanel.remove();page.querySelectorAll('.vv-actions > :not(.vv-lang)').forEach(el=>el.remove());
    loading.remove();page.hidden=false;setLang('de');
    const budgetScript=document.createElement('script');
    budgetScript.src='./valuventum-budget.js?v=population-v4-clear-units';
    budgetScript.onload=()=>{
      const budgetHost=document.getElementById('vv-budget-distribution');
      if(budgetHost && budgetHost.shadowRoot){
        const sr=budgetHost.shadowRoot;
        normalizeMagnitudeUnits(sr);
        const unitObserver=new MutationObserver(()=>normalizeMagnitudeUnits(sr));
        unitObserver.observe(sr,{subtree:true,childList:true,characterData:true});
      }
      normalizeMagnitudeUnits(page);
    };
    slot.appendChild(budgetScript);
  }catch(err){loading.innerHTML='<div style="padding:32px;text-align:center"><h1 style="color:#0f5a46">VALUVENTUM®</h1><p>Die Startseite konnte nicht geladen werden.</p><small>'+String(err.message||err)+'</small></div>';}
})();
</script>
