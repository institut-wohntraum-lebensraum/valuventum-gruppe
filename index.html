<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALUVENTUM® DEZENTRAL – Das Instrument der Freiheit</title>
<meta name="description" content="VALUVENTUM® Gruppen-Testversion – Original-Startbereich mit Grundeinkommen sowie menschenzentrierter Budget- und Verteilungsrechnung.">
<style>
html,body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}
#vv-loading{min-height:100vh;display:grid;place-items:center;color:#0f5a46;font-weight:850}
#vv-budget-slot{background:#fff}
.vv-explain,.vv-basic{width:min(1180px,92%);margin:22px auto 8px;padding:30px;border:1px solid #dce6e0;border-radius:24px;background:linear-gradient(145deg,#f7fbf8,#fffaf0);box-shadow:0 14px 36px rgba(15,90,70,.06)}
.vv-explain .vv-kicker,.vv-basic .vv-kicker{color:#b47c08;font-size:.74rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.vv-explain h2,.vv-basic h2{margin:8px 0 10px;color:#0f5a46;font-size:clamp(1.8rem,3.2vw,2.8rem);line-height:1.08}
.vv-explain>p,.vv-basic>p{max-width:940px;margin:0;color:#66746f;line-height:1.68;font-size:1rem}
.vv-explain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.vv-explain-card{padding:17px;border:1px solid #dce6e0;border-radius:16px;background:#fff}
.vv-explain-card b{display:block;color:#0f5a46;font-size:1.12rem;margin-bottom:5px}.vv-explain-card span{color:#66746f;font-size:.88rem;line-height:1.5}
.vv-explain-result{margin-top:16px;padding:16px 18px;border-left:5px solid #c99a2e;border-radius:0 14px 14px 0;background:#fff;color:#4e5c57;line-height:1.58}.vv-explain-result strong{color:#0f5a46}
.vv-basic{background:linear-gradient(145deg,#fffdf7,#f5faf7)}
.vv-basic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.vv-basic-card{padding:18px;border:1px solid #dce6e0;border-radius:17px;background:#fff}
.vv-basic-card span{display:block;color:#73807c;font-size:.78rem;font-weight:800}.vv-basic-card b{display:block;margin-top:7px;color:#0f5a46;font-size:1.22rem;font-variant-numeric:tabular-nums}
.vv-basic-card.total{background:#0f5a46;border-color:#0f5a46}.vv-basic-card.total span{color:#d7ece4}.vv-basic-card.total b{color:#ffd56c}
.vv-basic-formula{margin-top:16px;padding:15px 17px;border-radius:14px;background:#fff;border:1px solid #dce6e0;color:#35443f;font-weight:800;line-height:1.55;font-variant-numeric:tabular-nums}
.vv-basic-note{margin-top:13px;padding:15px 17px;border-left:5px solid #c99a2e;border-radius:0 14px 14px 0;background:#fffaf0;color:#5e6b67;line-height:1.58;font-size:.9rem}.vv-basic-note strong{color:#0f5a46}
@media(max-width:900px){.vv-basic-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.vv-explain,.vv-basic{padding:22px}.vv-explain-grid,.vv-basic-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="vv-loading">VALUVENTUM® wird geladen …</div>
<div id="vv-page" hidden></div>
<script>
(async function(){
  const loading=document.getElementById('vv-loading');
  const page=document.getElementById('vv-page');
  try{
    const r=await fetch('./startseite-original.html?v=original-top-5',{cache:'no-store'});
    if(!r.ok) throw new Error('Original-Startseite konnte nicht geladen werden.');
    const source=await r.text();
    const doc=new DOMParser().parseFromString(source,'text/html');
    doc.head.querySelectorAll('style').forEach(oldStyle=>{const style=document.createElement('style');if(oldStyle.id) style.id='vv-original-'+oldStyle.id;style.textContent=oldStyle.textContent;document.head.appendChild(style);});
    const originalHeader=doc.querySelector('header.vv-header');
    const startRoute=doc.querySelector('.vv-route[data-route="startseite"]');
    const originalHero=startRoute && startRoute.querySelector('section.hero');
    const originalStats=startRoute && startRoute.querySelector('section.stats');
    if(!originalHero || !originalStats) throw new Error('Der obere Originalbereich wurde nicht gefunden.');
    if(originalHeader) page.appendChild(originalHeader.cloneNode(true));
    const main=document.createElement('main');
    const hero=originalHero.cloneNode(true);
    const stats=originalStats.cloneNode(true);
    hero.querySelectorAll('.cta-row a').forEach(a=>a.setAttribute('href','#vv-basic-income'));
    main.appendChild(hero);main.appendChild(stats);

    const explain=document.createElement('section');
    explain.className='vv-explain';
    explain.innerHTML=`
      <div class="vv-kicker" data-vvx="kicker">DIE NEUE RECHNUNG · MENSCHENZENTRIERT</div>
      <h2 data-vvx="title">Wie werden die 52,04 Billionen Valu jetzt verteilt?</h2>
      <p data-vvx="lead">Nicht mehr jeder Kontinent erhält denselben Betrag. Stattdessen wird jeder Mensch im Modell gleich gewichtet. Der Anteil eines Kontinents am verfügbaren Gemeinschaftsbudget richtet sich deshalb nach seinem Anteil an der Weltbevölkerung. Vor dieser Verteilung steht jedoch immer zuerst das Grundeinkommen.</p>
      <div class="vv-explain-grid">
        <div class="vv-explain-card"><b>1 · Gemeinschaftstopf</b><span data-vvx="step1">Ausgangspunkt ist eine VALUVENTUM®-Rechengröße von 2,0 Billiarden Valu pro Jahr. Bei 10 % entstehen 200 Billionen Valu Gemeinschaftstopf.</span></div>
        <div class="vv-explain-card"><b>2 · Grundeinkommen zuerst</b><span data-vvx="step2">Das Grundeinkommen wird als erster großer Ausgabeblock gerechnet. Im Basismodell sind das 1.500 Valu pro Mensch und Monat beziehungsweise 147,96 Billionen Valu pro Jahr weltweit.</span></div>
        <div class="vv-explain-card"><b>3 · Danach Gemeinschaftsaufgaben</b><span data-vvx="step3">Erst der danach verbleibende Betrag wird – nach einem globalen Puffer – menschenzentriert auf die Kontinente und anschließend auf die Aufgabenbereiche verteilt.</span></div>
      </div>
      <div class="vv-explain-result"><strong data-vvx="resultH">Die Reihenfolge ist entscheidend:</strong> <span data-vvx="resultP">Gemeinschaftstopf → Grundeinkommen → verbleibendes Gemeinschaftsbudget → Verteilung nach Menschen → Verwendung für öffentliche Aufgaben, Landwirtschaft, Gesundheit, Bildung und Reserve.</span></div>`;
    main.appendChild(explain);

    const basic=document.createElement('section');
    basic.className='vv-basic';
    basic.id='vv-basic-income';
    basic.innerHTML=`
      <div class="vv-kicker" data-vvb="kicker">GRUNDEINKOMMEN · ERSTER SCHRITT</div>
      <h2 data-vvb="title">Das Grundeinkommen steht vor der Verteilung des Restbudgets.</h2>
      <p data-vvb="lead">Im VALUVENTUM®-Basismodell wird das Grundeinkommen für alle im Modell berücksichtigten Menschen zuerst vollständig berechnet. Es ist eine direkte Leistung an die Menschen und darf nicht mit dem späteren Pro-Kopf-Verteilungsschlüssel für Gemeinschaftsaufgaben verwechselt werden.</p>
      <div class="vv-basic-grid">
        <div class="vv-basic-card"><span data-vvb="people">Menschen im Basismodell</span><b>8,22 Mrd.</b></div>
        <div class="vv-basic-card"><span data-vvb="monthly">Grundeinkommen pro Mensch / Monat</span><b>1.500 Valu</b></div>
        <div class="vv-basic-card"><span data-vvb="yearly">Grundeinkommen pro Mensch / Jahr</span><b>18.000 Valu</b></div>
        <div class="vv-basic-card total"><span data-vvb="total">Grundeinkommen weltweit / Jahr</span><b>147,96 Bio. Valu</b></div>
      </div>
      <div class="vv-basic-formula" data-vvb="formula">8,22 Mrd. Menschen × 1.500 Valu × 12 Monate = 147,96 Billionen Valu pro Jahr</div>
      <div class="vv-basic-note"><strong data-vvb="importantH">Wichtig:</strong> <span data-vvb="importantP">Die 147,96 Billionen Valu werden im Basismodell zuerst vom 200-Billionen-Gemeinschaftstopf abgezogen. Bei 10 % Gemeinschaftsbeitrag bleiben danach 52,04 Billionen Valu für Gemeinschaftsaufgaben. Der später angezeigte Pro-Kopf-Verteilungsschlüssel von rund 6.326 Valu ist keine zweite Auszahlung an die Menschen, sondern nur die Rechengröße, mit der dieses Restbudget fair nach Bevölkerung auf die Kontinente verteilt wird.</span></div>`;
    main.appendChild(basic);

    const slot=document.createElement('div');slot.id='vv-budget-slot';main.appendChild(slot);page.appendChild(main);

    const text={
      de:{eyebrow:'VALUVENTUM® DEZENTRAL · Menschen · Werte · Gemeinschaft · Zukunft',title:'Ein Instrument für <span>Freiheit</span>.',lead:'VALUVENTUM® ist ein global gedachtes Gemeinschaftsmodell, das wirtschaftlichen Fluss, Transparenz und ein bedingungsloses Grundeinkommen miteinander verbindet.',status:'<strong>Gruppen-Testversion:</strong> Nur die VALUVENTUM®-Startseite ist freigegeben. Diese Seite dient zum Lernen, Prüfen und Ausprobieren.',cta1:'Modell ansehen',cta2:'Projekt unterstützen',s1:'Menschen weltweit',s2:'pro Mensch und Monat',s3:'jährlicher Modellbedarf',s4:'Gemeinschaftsbeitrag im Modell',home:'Startseite',badge:'GRUPPENTEST · NUR STARTSEITE',kicker:'DIE NEUE RECHNUNG · MENSCHENZENTRIERT',title2:'Wie werden die 52,04 Billionen Valu jetzt verteilt?',lead2:'Nicht mehr jeder Kontinent erhält denselben Betrag. Stattdessen wird jeder Mensch im Modell gleich gewichtet. Der Anteil eines Kontinents am verfügbaren Gemeinschaftsbudget richtet sich deshalb nach seinem Anteil an der Weltbevölkerung. Vor dieser Verteilung steht jedoch immer zuerst das Grundeinkommen.',step1:'Ausgangspunkt ist eine VALUVENTUM®-Rechengröße von 2,0 Billiarden Valu pro Jahr. Bei 10 % entstehen 200 Billionen Valu Gemeinschaftstopf.',step2:'Das Grundeinkommen wird als erster großer Ausgabeblock gerechnet. Im Basismodell sind das 1.500 Valu pro Mensch und Monat beziehungsweise 147,96 Billionen Valu pro Jahr weltweit.',step3:'Erst der danach verbleibende Betrag wird – nach einem globalen Puffer – menschenzentriert auf die Kontinente und anschließend auf die Aufgabenbereiche verteilt.',resultH:'Die Reihenfolge ist entscheidend:',resultP:'Gemeinschaftstopf → Grundeinkommen → verbleibendes Gemeinschaftsbudget → Verteilung nach Menschen → Verwendung für öffentliche Aufgaben, Landwirtschaft, Gesundheit, Bildung und Reserve.',basicKicker:'GRUNDEINKOMMEN · ERSTER SCHRITT',basicTitle:'Das Grundeinkommen steht vor der Verteilung des Restbudgets.',basicLead:'Im VALUVENTUM®-Basismodell wird das Grundeinkommen für alle im Modell berücksichtigten Menschen zuerst vollständig berechnet. Es ist eine direkte Leistung an die Menschen und darf nicht mit dem späteren Pro-Kopf-Verteilungsschlüssel für Gemeinschaftsaufgaben verwechselt werden.',people:'Menschen im Basismodell',monthly:'Grundeinkommen pro Mensch / Monat',yearly:'Grundeinkommen pro Mensch / Jahr',total:'Grundeinkommen weltweit / Jahr',formula:'8,22 Mrd. Menschen × 1.500 Valu × 12 Monate = 147,96 Billionen Valu pro Jahr',importantH:'Wichtig:',importantP:'Die 147,96 Billionen Valu werden im Basismodell zuerst vom 200-Billionen-Gemeinschaftstopf abgezogen. Bei 10 % Gemeinschaftsbeitrag bleiben danach 52,04 Billionen Valu für Gemeinschaftsaufgaben. Der später angezeigte Pro-Kopf-Verteilungsschlüssel von rund 6.326 Valu ist keine zweite Auszahlung an die Menschen, sondern nur die Rechengröße, mit der dieses Restbudget fair nach Bevölkerung auf die Kontinente verteilt wird.'},
      en:{eyebrow:'VALUVENTUM® DECENTRALISED · People · Values · Community · Future',title:'An instrument for <span>freedom</span>.',lead:'VALUVENTUM® is a globally conceived community model combining economic flow, transparency and an unconditional basic income.',status:'<strong>Group test version:</strong> Only the VALUVENTUM® home page is enabled. This page is for learning, testing and understanding.',cta1:'View model',cta2:'Support project',s1:'people worldwide',s2:'per person and month',s3:'annual model requirement',s4:'community contribution in the model',home:'Home',badge:'GROUP TEST · HOME PAGE ONLY',kicker:'THE NEW CALCULATION · PEOPLE-CENTRED',title2:'How are the 52.04 trillion Valu distributed now?',lead2:'Continents no longer receive equal amounts. Every person is weighted equally. Before this distribution, however, basic income is always calculated first.',step1:'The starting point is a VALUVENTUM® calculation base of 2.0 quadrillion Valu per year. At 10%, this produces a 200 trillion Valu community pool.',step2:'Basic income is calculated as the first major expenditure block. In the base model this is 1,500 Valu per person per month, or 147.96 trillion Valu per year worldwide.',step3:'Only the remaining amount is then distributed, after a global buffer, across continents by population and across community tasks.',resultH:'The order matters:',resultP:'Community pool → basic income → remaining community budget → people-centred distribution → public tasks, agriculture, health, education and reserve.',basicKicker:'BASIC INCOME · FIRST STEP',basicTitle:'Basic income comes before distribution of the remaining budget.',basicLead:'In the VALUVENTUM® base model, basic income for all people included in the model is calculated first. It is a direct benefit to people and must not be confused with the later per-capita allocation key for community tasks.',people:'People in the base model',monthly:'Basic income per person / month',yearly:'Basic income per person / year',total:'Worldwide basic income / year',formula:'8.22 billion people × 1,500 Valu × 12 months = 147.96 trillion Valu per year',importantH:'Important:',importantP:'The 147.96 trillion Valu are deducted first from the 200 trillion Valu community pool. At a 10% contribution, 52.04 trillion Valu then remain for community tasks. The later per-capita allocation key of about 6,326 Valu is not a second payment to people; it is only the calculation value used to distribute this remaining budget fairly across continents by population.'},
      es:{eyebrow:'VALUVENTUM® DESCENTRAL · Personas · Valores · Comunidad · Futuro',title:'Un instrumento para la <span>libertad</span>.',lead:'VALUVENTUM® es un modelo comunitario de alcance global que combina flujo económico, transparencia y una renta básica incondicional.',status:'<strong>Versión de prueba grupal:</strong> Solo está habilitada la página de inicio de VALUVENTUM®. Esta página sirve para aprender, comprobar y experimentar.',cta1:'Ver modelo',cta2:'Apoyar proyecto',s1:'personas en el mundo',s2:'por persona y mes',s3:'necesidad anual del modelo',s4:'aportación comunitaria en el modelo',home:'Inicio',badge:'PRUEBA DE GRUPO · SOLO INICIO',kicker:'EL NUEVO CÁLCULO · CENTRADO EN LAS PERSONAS',title2:'¿Cómo se distribuyen ahora los 52,04 billones Valu?',lead2:'Los continentes ya no reciben la misma cantidad. Cada persona tiene el mismo peso. Sin embargo, antes de esta distribución siempre se calcula primero la renta básica.',step1:'El punto de partida es una base de cálculo VALUVENTUM® de 2,0 mil billones Valu al año. Con el 10 % se forma un fondo comunitario de 200 billones Valu.',step2:'La renta básica se calcula como primer gran bloque de gasto. En el modelo base son 1.500 Valu por persona y mes, es decir, 147,96 billones Valu al año en todo el mundo.',step3:'Solo el importe restante se distribuye después, tras un fondo global, entre los continentes según población y entre las tareas comunitarias.',resultH:'El orden es decisivo:',resultP:'Fondo comunitario → renta básica → presupuesto comunitario restante → distribución centrada en las personas → tareas públicas, agricultura, salud, educación y reserva.',basicKicker:'RENTA BÁSICA · PRIMER PASO',basicTitle:'La renta básica se calcula antes de distribuir el presupuesto restante.',basicLead:'En el modelo base VALUVENTUM®, primero se calcula completamente la renta básica para todas las personas incluidas en el modelo. Es una prestación directa a las personas y no debe confundirse con la posterior clave per cápita para tareas comunitarias.',people:'Personas en el modelo base',monthly:'Renta básica por persona / mes',yearly:'Renta básica por persona / año',total:'Renta básica mundial / año',formula:'8,22 mil millones de personas × 1.500 Valu × 12 meses = 147,96 billones Valu al año',importantH:'Importante:',importantP:'Los 147,96 billones Valu se descuentan primero del fondo comunitario de 200 billones Valu. Con una aportación del 10 %, quedan después 52,04 billones Valu para tareas comunitarias. La posterior clave per cápita de unos 6.326 Valu no es un segundo pago a las personas; es solo el valor de cálculo utilizado para distribuir este presupuesto restante de forma justa entre continentes según población.'}
    };

    function setLang(lang){
      if(!text[lang])lang='de';
      document.documentElement.lang=lang;
      const t=text[lang],q=s=>page.querySelector(s);
      const eyebrow=q('.hero [data-i18n="eyebrow"]');if(eyebrow)eyebrow.textContent=t.eyebrow;
      const title=q('.hero [data-i18n="title"]');if(title)title.innerHTML=t.title;
      const lead=q('.hero [data-i18n="lead"]');if(lead)lead.textContent=t.lead;
      const status=q('.hero .decentral-status');if(status)status.innerHTML=t.status;
      const cta1=q('.hero [data-i18n="cta1"]');if(cta1)cta1.textContent=t.cta1;
      const cta2=q('.hero [data-i18n="cta2"]');if(cta2)cta2.textContent=t.cta2;
      ['s1','s2','s3','s4'].forEach(k=>{const el=q('.stats [data-i18n="'+k+'"]');if(el)el.textContent=t[k];});
      const home=q('.vv-nav .vv-link');if(home)home.textContent=t.home;
      const badge=q('.vv-group-badge');if(badge)badge.textContent=t.badge;
      const map={kicker:'kicker',title:'title2',lead:'lead2',step1:'step1',step2:'step2',step3:'step3',resultH:'resultH',resultP:'resultP'};
      Object.entries(map).forEach(([key,val])=>{const el=q('[data-vvx="'+key+'"]');if(el)el.textContent=t[val];});
      const basicMap={kicker:'basicKicker',title:'basicTitle',lead:'basicLead',people:'people',monthly:'monthly',yearly:'yearly',total:'total',formula:'formula',importantH:'importantH',importantP:'importantP'};
      Object.entries(basicMap).forEach(([key,val])=>{const el=q('[data-vvb="'+key+'"]');if(el)el.textContent=t[val];});
      page.querySelectorAll('.vv-lang button[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
      document.dispatchEvent(new CustomEvent('valuventum:language',{detail:{lang}}));
    }

    page.querySelectorAll('.vv-lang button[data-lang]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();setLang(btn.dataset.lang);}));
    const nav=page.querySelector('.vv-nav');if(nav){Array.from(nav.children).forEach(el=>{if(!(el.classList.contains('vv-current')||el.classList.contains('vv-group-badge')))el.remove();});}
    const mobile=page.querySelector('.vv-mobile-btn');if(mobile)mobile.remove();const mobilePanel=page.querySelector('.vv-mobile-panel');if(mobilePanel)mobilePanel.remove();page.querySelectorAll('.vv-actions > :not(.vv-lang)').forEach(el=>el.remove());
    loading.remove();page.hidden=false;setLang('de');
    const budgetScript=document.createElement('script');budgetScript.src='./valuventum-budget.js?v=population-v4-basic';slot.appendChild(budgetScript);
  }catch(err){loading.innerHTML='<div style="padding:32px;text-align:center"><h1 style="color:#0f5a46">VALUVENTUM®</h1><p>Die Startseite konnte nicht geladen werden.</p><small>'+String(err.message||err)+'</small></div>';}
})();
</script>
</body>
</html>
