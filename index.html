<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALUVENTUM® – Gruppen-Test · Startseite</title>
<style>html,body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}.vv-loading{min-height:100vh;display:grid;place-items:center;color:#0f5a46;font-weight:800}</style>
</head>
<body>
<div class="vv-loading">VALUVENTUM® wird geladen …</div>
<script>
(async function(){
  function integratedBudget(){
    'use strict';
    const section=document.getElementById('rechner');
    if(!section)return;

    const copy={
      de:{
        calcP:'Der Rechner zeigt zuerst den jährlichen Grundeinkommensbedarf. Zusätzlich wird die VALUVENTUM®-Szenariorechnung sichtbar: 10 % eines Modellflusses von 2,0 Billiarden Valu ergeben 0,2 Billiarden Valu. Nach Abzug des Grundeinkommens wird der verbleibende Gemeinschaftsbetrag auf sieben Kontinente beziehungsweise globale Aufgaben und die gewählten Bereiche verteilt. Der McKinsey-Wert von 2,0 Billiarden USD bleibt davon getrennt der externe Quellenanker.',
        pool:'10-%-Modelltopf',remaining:'Nach Grundeinkommen verbleibend',per7:'Je Kontinent / Globalbereich',tax:'Modellziel bei vollständiger Deckung',taxValue:'0 % Einkommensteuer · 0 % Produkt/MwSt',
        headGreen:'GRÜN – Verteilung mit Reserve',headYellow:'GELB – kaum Reserve',headRed:'ROT – Budget überschritten',
        textGreen:'Das Grundeinkommen ist bereits abgezogen. Die gewählte Verteilung bleibt innerhalb des verbleibenden Gemeinschaftsbudgets.',textYellow:'Die Verteilung bleibt noch innerhalb des Gemeinschaftsbudgets, aber die Reserve ist kleiner als 5 %.',textRed:'Die gewählten Bereiche überschreiten zusammen 100 % des verbleibenden Gemeinschaftsbudgets.',
        scale:'Ampel: Grün = mindestens 5 % Reserve · Gelb = 0 bis unter 5 % Reserve · Rot = über 100 % verplant',
        distribute:'52,04 Billionen Valu verteilen',public:'Öffentliche Aufgaben / Steuerersatz',publicHint:'Infrastruktur, Sicherheit, Feuerwehr, Verwaltung und weitere Gemeinschaftsaufgaben.',agri:'Gesunde Landwirtschaft',agriHint:'Bodenaufbau, schadstoffärmere Produktion, natürliches Saatgut sowie mechanische und solare Agrartechnik.',health:'Gesundheitssystem',healthHint:'Versorgung, Prävention, Pflege, Personal und notwendige Gesundheitsinfrastruktur.',education:'Bildung & Forschung',educationHint:'Schulen, Ausbildung, Weiterbildung, Forschung und frei zugängliches Wissen.',reserve:'Reserve',global:'Global',continent:'Je Kontinent',
        effect:'Heilwirkung im übertragenen Sinn',effectText:'Modellziel: wirtschaftlichen Druck verringern, gesündere Böden und Ernährung fördern, Gesundheitsversorgung stärken und Bildung langfristig absichern. Das ist keine medizinische Heilzusage.',
        note:'Transparenz: Die 52,04 Billionen Valu sind eine VALUVENTUM®-Szenariorechnung mit 2,0 Billiarden Valu als Modellfluss. McKinsey nennt 2,0 Billiarden USD an globalen „value flows“; dieser externe USD-Wert ist nicht automatisch ein Valu-Wert.'
      },
      en:{
        calcP:'The calculator first shows the annual basic-income requirement. It also displays the VALUVENTUM® scenario calculation: 10% of a model flow of 2.0 quadrillion Valu equals 0.2 quadrillion Valu. After basic income is deducted, the remaining community amount is distributed across seven continents or global tasks and the selected areas. McKinsey’s USD 2.0 quadrillion remains a separate external source anchor.',
        pool:'10% model pool',remaining:'Remaining after basic income',per7:'Per continent / global area',tax:'Model target with full coverage',taxValue:'0% income tax · 0% product/VAT',
        headGreen:'GREEN – allocation with reserve',headYellow:'YELLOW – little reserve',headRed:'RED – budget exceeded',
        textGreen:'Basic income has already been deducted. The selected allocation remains within the remaining community budget.',textYellow:'The allocation still remains within the community budget, but reserve is below 5%.',textRed:'The selected areas together exceed 100% of the remaining community budget.',
        scale:'Traffic light: Green = at least 5% reserve · Yellow = 0 to under 5% reserve · Red = over 100% allocated',
        distribute:'Distribute 52.04 trillion Valu',public:'Public tasks / tax replacement',publicHint:'Infrastructure, security, fire services, administration and other community tasks.',agri:'Healthy agriculture',agriHint:'Soil restoration, lower-pollutant production, natural seed and mechanical and solar agricultural technology.',health:'Health system',healthHint:'Care, prevention, nursing, staff and necessary health infrastructure.',education:'Education & research',educationHint:'Schools, training, continuing education, research and accessible knowledge.',reserve:'Reserve',global:'Global',continent:'Per continent',
        effect:'Healing effect in a broader sense',effectText:'Model objective: reduce economic pressure, support healthier soils and food, strengthen health care and secure education over the long term. This is not a medical promise of healing.',
        note:'Transparency: The 52.04 trillion Valu are a VALUVENTUM® scenario calculation using 2.0 quadrillion Valu as a model flow. McKinsey cites USD 2.0 quadrillion in global “value flows”; this external USD figure is not automatically a Valu figure.'
      },
      es:{
        calcP:'La calculadora muestra primero la necesidad anual de renta básica. Además hace visible el escenario VALUVENTUM®: el 10 % de un flujo modelo de 2,0 mil billones Valu equivale a 0,2 mil billones Valu. Tras descontar la renta básica, el importe comunitario restante se distribuye entre siete continentes o tareas globales y las áreas seleccionadas. Los 2,0 mil billones USD de McKinsey siguen siendo una referencia externa separada.',
        pool:'Fondo modelo del 10 %',remaining:'Restante después de la renta básica',per7:'Por continente / área global',tax:'Objetivo del modelo con cobertura total',taxValue:'0 % renta · 0 % producto/IVA',
        headGreen:'VERDE – distribución con reserva',headYellow:'AMARILLO – poca reserva',headRed:'ROJO – presupuesto excedido',
        textGreen:'La renta básica ya está descontada. La distribución elegida permanece dentro del presupuesto comunitario restante.',textYellow:'La distribución aún permanece dentro del presupuesto comunitario, pero la reserva es inferior al 5 %.',textRed:'Las áreas elegidas superan conjuntamente el 100 % del presupuesto comunitario restante.',
        scale:'Semáforo: Verde = al menos 5 % de reserva · Amarillo = de 0 a menos del 5 % · Rojo = más del 100 % asignado',
        distribute:'Distribuir 52,04 billones Valu',public:'Tareas públicas / sustitución fiscal',publicHint:'Infraestructura, seguridad, bomberos, administración y otras tareas comunitarias.',agri:'Agricultura saludable',agriHint:'Regeneración del suelo, producción con menos contaminantes, semillas naturales y tecnología agrícola mecánica y solar.',health:'Sistema de salud',healthHint:'Atención, prevención, cuidados, personal e infraestructura sanitaria necesaria.',education:'Educación e investigación',educationHint:'Escuelas, formación, educación continua, investigación y conocimiento accesible.',reserve:'Reserva',global:'Global',continent:'Por continente',
        effect:'Efecto reparador en sentido amplio',effectText:'Objetivo del modelo: reducir la presión económica, favorecer suelos y alimentos más sanos, reforzar la atención sanitaria y asegurar la educación a largo plazo. No es una promesa médica de curación.',
        note:'Transparencia: los 52,04 billones Valu son un cálculo de escenario VALUVENTUM® con 2,0 mil billones Valu como flujo modelo. McKinsey cita 2,0 mil billones USD en “flujos de valor” globales; esa cifra externa en USD no es automáticamente una cifra Valu.'
      }
    };

    function lang(){const v=(document.documentElement.lang||'de').toLowerCase();return v.startsWith('en')?'en':v.startsWith('es')?'es':'de';}
    function locale(){return lang()==='de'?'de-DE':lang()==='es'?'es-ES':'en-US';}
    function n(id){const el=document.getElementById(id);return el?Number(el.value)||0:0;}
    function fmt(value,digits){return Number(value).toLocaleString(locale(),{minimumFractionDigits:digits,maximumFractionDigits:digits});}
    function bio(value,digits){return fmt(value/1e12,digits)+(lang()==='en'?' tn Valu':' Bio. Valu');}

    function setLabels(){
      const c=copy[lang()];
      const intro=section.querySelector('[data-i18n="calcP"]');
      if(intro)intro.textContent=c.calcP;
      section.querySelectorAll('[data-vv-text]').forEach(el=>{const key=el.getAttribute('data-vv-text');if(c[key])el.textContent=c[key];});
      const taxValue=document.getElementById('vv-tax-value');if(taxValue)taxValue.textContent=c.taxValue;
      const effect=document.getElementById('vv-effect-text');if(effect)effect.textContent=c.effectText;
      const note=document.getElementById('vv-budget-note');if(note)note.textContent=c.note;
    }

    function recalc(){
      const people=n('peopleExact');
      const basic=n('basicExact');
      const annual=people*basic*12;
      const pool=2e15*0.10;
      const remaining=pool-annual;
      const per7=remaining>0?remaining/7:0;

      const poolEl=document.getElementById('vv-pool');if(poolEl)poolEl.textContent=bio(pool,2);
      const remEl=document.getElementById('vv-remaining');if(remEl)remEl.textContent=remaining>=0?bio(remaining,2):'- '+bio(Math.abs(remaining),2);
      const perEl=document.getElementById('vv-per7');if(perEl)perEl.textContent=remaining>=0?bio(per7,3):'—';

      const ids=['public','agri','health','education'];
      const shares=ids.map(id=>n('vv-'+id));
      const sum=shares.reduce((a,b)=>a+b,0);
      const reserve=100-sum;
      ids.forEach((id,i)=>{
        const pct=document.getElementById('vv-'+id+'-pct');if(pct)pct.textContent=shares[i]+' %';
        const global=document.getElementById('vv-'+id+'-global');if(global)global.textContent=remaining>0?bio(remaining*shares[i]/100,3):'—';
        const continent=document.getElementById('vv-'+id+'-continent');if(continent)continent.textContent=remaining>0?bio(per7*shares[i]/100,3):'—';
      });
      const reservePct=document.getElementById('vv-reserve-pct');if(reservePct)reservePct.textContent=reserve+' %';
      const reserveGlobal=document.getElementById('vv-reserve-global');if(reserveGlobal)reserveGlobal.textContent=remaining>0&&reserve>=0?bio(remaining*reserve/100,3):'—';
      const reserveCont=document.getElementById('vv-reserve-continent');if(reserveCont)reserveCont.textContent=remaining>0&&reserve>=0?bio(per7*reserve/100,3):'—';

      const status=document.getElementById('trafficStatus');
      const headline=document.getElementById('trafficHeadline');
      const text=document.getElementById('trafficText');
      const c=copy[lang()];
      if(status&&headline&&text){
        status.classList.remove('dark-green');
        if(remaining<0||reserve<0){status.dataset.state='red';headline.textContent=c.headRed;text.textContent=c.textRed;status.style.background='#fff0ef';status.style.borderColor='#efb0aa';}
        else if(reserve<5){status.dataset.state='yellow';headline.textContent=c.headYellow;text.textContent=c.textYellow;status.style.background='#fff8df';status.style.borderColor='#e9d17f';}
        else{status.dataset.state='green';status.classList.add('dark-green');headline.textContent=c.headGreen;text.textContent=c.textGreen;status.style.background='';status.style.borderColor='';}
      }
      const scale=document.getElementById('vv-traffic-scale');if(scale)scale.textContent=c.scale;
      setLabels();
    }

    ['people','peopleExact','basic','basicExact','active','activeExact','vv-public','vv-agri','vv-health','vv-education'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.addEventListener('input',()=>requestAnimationFrame(recalc));el.addEventListener('change',()=>requestAnimationFrame(recalc));}
    });
    document.querySelectorAll('.vv-lang button[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setTimeout(recalc,20)));
    new MutationObserver(()=>setTimeout(recalc,0)).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
    setTimeout(recalc,0);
  }

  try{
    const response=await fetch('./startseite-original.html?v=7',{cache:'no-store'});
    if(!response.ok)throw new Error('Startseite konnte nicht geladen werden.');
    let html=await response.text();

    const calcStart=html.indexOf('<section class="section soft" id="rechner">');
    const resultsStart=html.indexOf('<div class="results">',calcStart);
    const trafficStart=html.indexOf('<div aria-live="polite" class="traffic-status dark-green"',resultsStart);
    const dataStart=html.indexOf('<section aria-labelledby="dataBasisTitle"',trafficStart);
    if(calcStart<0||resultsStart<0||trafficStart<0||dataStart<0)throw new Error('Rechnerstruktur nicht gefunden.');

    const newResults=`<div class="results">
<div class="result"><span>Grundeinkommen monatlich</span><b id="basicMonthly">1.500 Valu</b></div>
<div class="result"><span>Grundeinkommen jährlich</span><b id="basicYearly">18.000 Valu</b></div>
<div class="result"><span data-i18n="activeBase">Verifiziert Tätige</span><b id="activeBase">3.500.000.000 Menschen</b></div>
<div class="result"><span>Gemeinschaftsbeitrag der Tätigen</span><b id="activeDeduction">10 %</b></div>
<div class="result"><span data-i18n="annualNeed">Jährlicher Modellbedarf</span><b id="annualNeed">0,14796 Billiarden Valu</b></div>
<div class="result"><span data-i18n="sourceAnchor">Quellenanker Zahlungsfluss</span><b>2,0 Billiarden USD</b></div>
<div class="result vv-result-highlight"><span data-vv-text="pool">10-%-Modelltopf</span><b id="vv-pool">200,00 Bio. Valu</b></div>
<div class="result vv-result-highlight"><span data-vv-text="remaining">Nach Grundeinkommen verbleibend</span><b id="vv-remaining">52,04 Bio. Valu</b></div>
<div class="result vv-result-highlight"><span data-vv-text="per7">Je Kontinent / Globalbereich</span><b id="vv-per7">7,434 Bio. Valu</b></div>
<div class="result vv-result-tax"><span data-vv-text="tax">Modellziel bei vollständiger Deckung</span><b id="vv-tax-value">0 % Einkommensteuer · 0 % Produkt/MwSt</b></div>
</div>
`;

    const newTraffic=`<div aria-live="polite" class="traffic-status dark-green vv-budget-traffic" data-state="green" id="trafficStatus">
<div aria-label="Deckungsampel" class="traffic-light">
<span class="lamp red" id="lampRed"></span>
<span class="lamp yellow" id="lampYellow"></span>
<span class="lamp green" id="lampGreen"></span>
</div>
<div class="traffic-copy">
<strong id="trafficHeadline">GRÜN – Verteilung mit Reserve</strong>
<span id="trafficText">Das Grundeinkommen ist bereits abgezogen. Die gewählte Verteilung bleibt innerhalb des verbleibenden Gemeinschaftsbudgets.</span>
<small id="vv-traffic-scale">Ampel: Grün = mindestens 5 % Reserve · Gelb = 0 bis unter 5 % Reserve · Rot = über 100 % verplant</small>
</div>
<div class="vv-budget-panel">
<div class="vv-budget-title" data-vv-text="distribute">52,04 Billionen Valu verteilen</div>
<div class="vv-budget-head"><span></span><b data-vv-text="global">Global</b><b data-vv-text="continent">Je Kontinent</b></div>
<div class="vv-budget-row"><div><strong data-vv-text="public">Öffentliche Aufgaben / Steuerersatz</strong><small data-vv-text="publicHint">Infrastruktur, Sicherheit, Feuerwehr, Verwaltung und weitere Gemeinschaftsaufgaben.</small><input id="vv-public" type="range" min="0" max="80" step="1" value="40"></div><b id="vv-public-pct">40 %</b><span id="vv-public-global">20,816 Bio. Valu</span><span id="vv-public-continent">2,974 Bio. Valu</span></div>
<div class="vv-budget-row"><div><strong data-vv-text="agri">Gesunde Landwirtschaft</strong><small data-vv-text="agriHint">Bodenaufbau, schadstoffärmere Produktion, natürliches Saatgut sowie mechanische und solare Agrartechnik.</small><input id="vv-agri" type="range" min="0" max="80" step="1" value="25"></div><b id="vv-agri-pct">25 %</b><span id="vv-agri-global">13,010 Bio. Valu</span><span id="vv-agri-continent">1,859 Bio. Valu</span></div>
<div class="vv-budget-row"><div><strong data-vv-text="health">Gesundheitssystem</strong><small data-vv-text="healthHint">Versorgung, Prävention, Pflege, Personal und notwendige Gesundheitsinfrastruktur.</small><input id="vv-health" type="range" min="0" max="80" step="1" value="20"></div><b id="vv-health-pct">20 %</b><span id="vv-health-global">10,408 Bio. Valu</span><span id="vv-health-continent">1,487 Bio. Valu</span></div>
<div class="vv-budget-row"><div><strong data-vv-text="education">Bildung &amp; Forschung</strong><small data-vv-text="educationHint">Schulen, Ausbildung, Weiterbildung, Forschung und frei zugängliches Wissen.</small><input id="vv-education" type="range" min="0" max="80" step="1" value="10"></div><b id="vv-education-pct">10 %</b><span id="vv-education-global">5,204 Bio. Valu</span><span id="vv-education-continent">0,743 Bio. Valu</span></div>
<div class="vv-budget-row vv-reserve-row"><div><strong data-vv-text="reserve">Reserve</strong></div><b id="vv-reserve-pct">5 %</b><span id="vv-reserve-global">2,602 Bio. Valu</span><span id="vv-reserve-continent">0,372 Bio. Valu</span></div>
<div class="vv-effect"><strong data-vv-text="effect">Heilwirkung im übertragenen Sinn</strong><span id="vv-effect-text">Modellziel: wirtschaftlichen Druck verringern, gesündere Böden und Ernährung fördern, Gesundheitsversorgung stärken und Bildung langfristig absichern. Das ist keine medizinische Heilzusage.</span></div>
<div class="vv-budget-note" id="vv-budget-note">Transparenz: Die 52,04 Billionen Valu sind eine VALUVENTUM®-Szenariorechnung mit 2,0 Billiarden Valu als Modellfluss. McKinsey nennt 2,0 Billiarden USD an globalen „value flows“; dieser externe USD-Wert ist nicht automatisch ein Valu-Wert.</div>
</div>
</div>
`;

    html=html.slice(0,resultsStart)+newResults+newTraffic+html.slice(dataStart);

    const style=`<style id="vv-integrated-budget-style">
#rechner .vv-result-highlight{background:#0b6b3a;box-shadow:inset 0 0 0 1px rgba(240,207,117,.34)}
#rechner .vv-result-tax{background:#fff8e7;color:#0f5a46;border:1px solid #ead9a7}
#rechner .vv-result-tax b{color:#9b6a00;font-size:1rem;line-height:1.35}
#trafficStatus.vv-budget-traffic{align-items:start}
#trafficStatus .vv-budget-panel{grid-column:1/-1;margin-top:4px;padding-top:18px;border-top:1px solid rgba(15,90,70,.16);display:grid;gap:10px}
#trafficStatus .vv-budget-title{color:#0f5a46;font-size:1.15rem;font-weight:900;margin-bottom:2px}
#trafficStatus .vv-budget-head{display:grid;grid-template-columns:minmax(0,1fr) 130px 150px;gap:10px;padding:0 10px;color:#0f5a46;font-size:.78rem;text-align:right}
#trafficStatus .vv-budget-row{display:grid;grid-template-columns:minmax(320px,1fr) 70px 130px 150px;gap:10px;align-items:center;padding:11px 12px;border:1px solid rgba(15,90,70,.14);border-radius:14px;background:rgba(255,255,255,.74)}
#trafficStatus .vv-budget-row>div{display:grid;gap:4px}#trafficStatus .vv-budget-row strong{color:#0f5a46}#trafficStatus .vv-budget-row small{color:#6b7773;line-height:1.35}#trafficStatus .vv-budget-row input[type=range]{width:100%;accent-color:#0f5a46;margin-top:4px}
#trafficStatus .vv-budget-row>b,#trafficStatus .vv-budget-row>span{text-align:right;color:#0f5a46;font-variant-numeric:tabular-nums;font-weight:850}
#trafficStatus .vv-reserve-row{background:#fff8e7;border-color:#ead9a7}
#trafficStatus .vv-effect{display:grid;gap:4px;margin-top:5px;padding:14px 16px;border-left:5px solid #c99a2e;border-radius:0 14px 14px 0;background:#fffaf0}#trafficStatus .vv-effect strong{color:#0f5a46}#trafficStatus .vv-effect span{color:#53615d;line-height:1.5}
#trafficStatus .vv-budget-note{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.6);color:#66746f;font-size:.82rem;line-height:1.5}
@media(max-width:820px){#trafficStatus .vv-budget-head{display:none}#trafficStatus .vv-budget-row{grid-template-columns:1fr 72px}#trafficStatus .vv-budget-row>span{grid-column:1/-1;text-align:left;font-size:.84rem}}
</style>`;
    html=html.replace(/<\/head\s*>/i,style+'</head>');

    const behavior='<script id="vv-integrated-budget-script">('+integratedBudget.toString()+')();<'+'/script>';
    html=html.replace(/<\/body\s*>/i,behavior+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="padding:32px;font-family:Arial,sans-serif;color:#0f5a46"><h1>VALUVENTUM®</h1><p>Die Startseite konnte nicht geladen werden. Bitte die Seite neu laden.</p><small>'+String(error.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
