name: Apply public 53-page navigation

on:
  push:
    paths:
      - 'scripts/apply_public_53_nav.py'
      - '.github/workflows/apply-public-53-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply navigation
        run: python3 scripts/apply_public_53_nav.py
      - name: Commit navigation
        run: |
          if git diff --quiet -- index.html 53_Globales_Voting.html; then
            echo 'No navigation changes needed.'
            exit 0
          fi
          git config user.name 'VALUVENTUM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html 53_Globales_Voting.html
          git commit -m 'Add 53-page buttons and back navigation'
          git push origin main
