name: Sync final IPFS site

on:
  push:
    paths:
      - '.github/workflows/sync-ipfs-final.yml'

permissions:
  contents: write

jobs:
  sync-final-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Pinata/IPFS folder and publish it
        env:
          CID: bafybeifa2p4dqqspt7dq2o3dvqldv4fvdhnpwfvynbvrvke6rfu5qdavau
        shell: bash
        run: |
          set -euo pipefail
          KUBO_VERSION=v0.35.0
          curl -fL --retry 4 "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz" -o /tmp/kubo.tgz
          tar -xzf /tmp/kubo.tgz -C /tmp
          /tmp/kubo/ipfs init --profile=lowpower
          nohup /tmp/kubo/ipfs daemon > /tmp/ipfs-daemon.log 2>&1 &
          for i in $(seq 1 30); do
            if /tmp/kubo/ipfs id >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          /tmp/kubo/ipfs id >/dev/null
          timeout 600 /tmp/kubo/ipfs get "$CID" -o /tmp/valuventum-final

          test -f /tmp/valuventum-final/index.html
          test -f /tmp/valuventum-final/02_Registrieren.html
          test -f /tmp/valuventum-final/34_Dezentrale_Architektur.html
          test -f /tmp/valuventum-final/53_Globales_Voting.html
          test "$(find /tmp/valuventum-final -maxdepth 1 -name '*.html' | wc -l)" -eq 53
          echo '10fd142063f3da745fa5d02120973af11998a448e1773b5b6f02ba06eb532b73  /tmp/valuventum-final/02_Registrieren.html' | sha256sum -c -
          echo 'aad837c8be4e45a6c10a7f464791581ed2da161d2ec81cf8702722a46ed98d6f  /tmp/valuventum-final/34_Dezentrale_Architektur.html' | sha256sum -c -
          echo 'fdf4b9a845ebf602a0e261787ecd972c70fb82bf0fdb7de6512add0a62efafe9  /tmp/valuventum-final/index.html' | sha256sum -c -

          git rm -r --ignore-unmatch .
          cp -a /tmp/valuventum-final/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish final 53-page IPFS version $CID"
          git push origin HEAD:main
