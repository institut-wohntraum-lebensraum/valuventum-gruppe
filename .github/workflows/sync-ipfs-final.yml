name: Sync final IPFS site

on:
  push:
    paths:
      - '.github/workflows/sync-ipfs-final.yml'

permissions:
  contents: write

jobs:
  sync-final-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact final Pinata folder and publish
        env:
          CID: bafybeifa2p4dqqspt7dq2o3dvqldv4fvdhnpwfvynbvrvke6rfu5qdavau
          GATEWAY: https://plum-brilliant-constrictor-196.mypinata.cloud/ipfs
          PATHS_GZ_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATHS_GZ_B64" | base64 -d | gzip -d > /tmp/paths.txt
          rm -rf /tmp/final-site
          mkdir -p /tmp/final-site

          fetch_one() {
            path="$1"
            mkdir -p "/tmp/final-site/$(dirname "$path")"
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "$GATEWAY/$CID/$path" -o "/tmp/final-site/$path"
          }

          fetch_one index.html
          fetch_one 02_Registrieren.html
          fetch_one 34_Dezentrale_Architektur.html
          echo '10fd142063f3da745fa5d02120973af11998a448e1773b5b6f02ba06eb532b73  /tmp/final-site/02_Registrieren.html' | sha256sum -c -
          echo 'aad837c8be4e45a6c10a7f464791581ed2da161d2ec81cf8702722a46ed98d6f  /tmp/final-site/34_Dezentrale_Architektur.html' | sha256sum -c -
          echo 'fdf4b9a845ebf602a0e261787ecd972c70fb82bf0fdb7de6512add0a62efafe9  /tmp/final-site/index.html' | sha256sum -c -

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -f "/tmp/final-site/$path" ]; then
              continue
            fi
            fetch_one "$path"
          done < /tmp/paths.txt

          test "$(find /tmp/final-site -maxdepth 1 -name '*.html' | wc -l)" -eq 53
          git rm -r --ignore-unmatch .
          cp -a /tmp/final-site/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish final 53-page IPFS version $CID"
          git push origin HEAD:main
