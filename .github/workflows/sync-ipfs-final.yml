          git rm -r --ignore-unmatch .

          while read -r expected path; do
            path="${path#./}"
            mkdir -p "$(dirname "$path")"
            tmp="$path.download"
            ok=0

            for base in \
              "https://gateway.pinata.cloud/ipfs" \
              "https://ipfs.io/ipfs" \
              "https://dweb.link/ipfs"
            do
              if curl --fail --location --silent --show-error \
                --retry 4 --retry-delay 2 --retry-all-errors \
                "$base/$CID/$path" -o "$tmp"; then
                mv "$tmp" "$path"
                ok=1
                break
              fi
            done

            if [ "$ok" -ne 1 ]; then
              echo "Download failed: $path" >&2
              exit 1
            fi
          done < /tmp/valuventum-sha256.txt

          sha256sum -c /tmp/valuventum-sha256.txt

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Repository already matches the final IPFS version."
            exit 0
          fi

          git commit -m "Publish final 53-page IPFS version $CID"
          git push origin HEAD:main
