 en el modelo base deja el salario ganado en manos de la persona; la renta básica permanece separada.',impactAgriH:'🌱 Suelo y alimentos',impactAgriP:'La inversión en suelos más sanos y agricultura con menos contaminantes busca fortalecer la calidad de los alimentos, la vida del suelo y el abastecimiento a largo plazo.',impactHealthH:'❤️ Salud',impactHealthP:'Una parte específica del presupuesto puede financiar prevención, atención médica, cuidados y servicios sanitarios accesibles.',impactEduH:'🎓 Educación',impactEduP:'La educación y la investigación buscan reforzar a largo plazo la autonomía, la innovación y la participación social.',importantH:'Distinción importante:',importantP:'La distribución de 52,04 billones es un cálculo de escenario VALUVENTUM®. Para esta visualización se usa un flujo modelo de 2,0 mil billones Valu como magnitud de cálculo. La cifra externa de McKinsey de 2,0 mil billones USD permanece separada como dato en USD; el semáforo no demuestra que todos los gastos públicos reales queden completamente cubiertos.',green:'VERDE · Distribución con reserva',greenCopy:'Las áreas elegidas permanecen dentro del presupuesto del modelo y dejan al menos un 5 % de reserva.',yellow:'AMARILLO · Poca reserva',yellowCopy:'La distribución sigue dentro del presupuesto, pero deja menos de un 5 % de reserva.',red:'ROJO · Presupuesto excedido',redCopy:'Las proporciones elegidas superan conjuntamente el 100 % del presupuesto disponible.'
    }
  };

  const $=s=>root.querySelector(s);
  const all=s=>Array.from(root.querySelectorAll(s));
  const total=52.04;
  const continent=total/7;
  let lang='de';
  const getLang=()=>{const l=(document.documentElement.lang||'de').slice(0,2).toLowerCase();return copy[l]?l:'de'};
  const fmt=n=>new Intl.NumberFormat(lang==='en'?'en-US':lang==='es'?'es-ES':'de-DE',{minimumFractionDigits:3,maximumFractionDigits:3}).format(n)+' Bio. Valu';
  function calculate(){
    const ids=['public','agri','health','education'];
    const values=ids.map(id=>Number($('#vvbd-'+id).value));
    ids.forEach((id,i)=>$('#vvbd-'+id+'-pct').textContent=values[i]);
    const sum=values.reduce((a,b)=>a+b,0);
    const reserve=100-sum;
    $('#vvbd-global').textContent=fmt(total*sum/100);
    $('#vvbd-continent').textContent=fmt(continent*sum/100);
    $('#vvbd-reserve').textContent=(reserve>=0?fmt(total*reserve/100):'- '+fmt(total*Math.abs(reserve)/100))+' · '+reserve+' %';
    const light=$('#vvbd-light');
    light.classList.remove('yellow','red');
    if(reserve<0){light.classList.add('red');$('#vvbd-status').textContent=copy[lang].red;$('#vvbd-status-copy').textContent=copy[lang].redCopy}
    else if(reserve<5){light.classList.add('yellow');$('#vvbd-status').textContent=copy[lang].yellow;$('#vvbd-status-copy').textContent=copy[lang].yellowCopy}
    else{$('#vvbd-status').textContent=copy[lang].green;$('#vvbd-status-copy').textContent=copy[lang].greenCopy}
  }
  function applyLanguage(next){
    lang=copy[next]?next:getLang();
    all('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(copy[lang][k]!==undefined)el.textContent=copy[lang][k]});
    calculate();
  }
  ['public','agri','health','education'].forEach(id=>$('#vvbd-'+id).addEventListener('input',calculate));
  document.addEventListener('valuventum:language',e=>applyLanguage(e.detail&&e.detail.lang));
  document.querySelectorAll('.vv-lang button[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setTimeout(()=>applyLanguage(btn.dataset.lang),0)));
  new MutationObserver(()=>applyLanguage(getLang())).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  function visibility(){const raw=decodeURIComponent(location.hash.slice(1)).split('/')[0];host.hidden=!!raw&&raw!=='startseite'}
  window.addEventListener('hashchange',visibility);
  visibility();
  applyLanguage(getLang());
})();
</script>
'''

          idx = text.lower().rfind('</body>')
          if idx < 0:
              text += '\n' + block
          else:
              text = text[:idx] + block + '\n' + text[idx:]
          path.write_text(text, encoding='utf-8')
          print('Budget distribution added.')
          PY
      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add continent budget distribution with impact and traffic light'
          git push
