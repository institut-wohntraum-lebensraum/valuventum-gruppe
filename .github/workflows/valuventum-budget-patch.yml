name: Create only Earth entry block

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valuventum-budget-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only Earth entry at top
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the previously added full-start-page / step-3 block only.
          text = re.sub(
              r'\n\s*<!-- SCHRITT 3 -->\s*<section class="card overview-card" id="gesamtbild">.*?</section>\s*',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          # Remove an older Earth-entry block if this workflow is run again.
          text = re.sub(
              r'\n?<!-- EARTH_ENTRY_ONLY_START -->.*?<!-- EARTH_ENTRY_ONLY_END -->\n?',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          css_marker = '/* EARTH_ENTRY_ONLY_CSS */'
          if css_marker not in text:
              css = r'''
/* EARTH_ENTRY_ONLY_CSS */
.earth-entry-only{
  min-height:620px;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 48%,#f1faf6 0,#ffffff 62%);
  overflow:hidden;
}
.earth-entry-globe{
  position:relative;
  width:min(430px,72vw);
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  background:
    radial-gradient(circle at 34% 26%,rgba(255,255,255,.7) 0 7%,transparent 25%),
    radial-gradient(circle at 38% 32%,#79c7da 0 28%,#3690ad 58%,#14576f 100%);
  border:4px solid #fff;
  box-shadow:
    0 0 0 2px rgba(199,154,46,.8),
    0 28px 70px rgba(15,90,70,.20),
    inset -28px -22px 48px rgba(0,45,62,.34);
}
.earth-entry-globe::before{
  content:"";
  position:absolute;
  width:36%;
  height:25%;
  left:13%;
  top:21%;
  background:#69a96b;
  border-radius:58% 42% 55% 38%;
  transform:rotate(-14deg);
  box-shadow:
    112px 45px 0 15px #5f9e62,
    24px 132px 0 2px #73b373,
    147px 155px 0 -8px #5b9c60,
    -31px 91px 0 -7px #82bd7d;
}
.earth-entry-globe::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 42% 67%,rgba(0,35,48,.24));
}
@media(max-width:560px){
  .earth-entry-only{min-height:420px}
  .earth-entry-globe{width:min(300px,76vw)}
}
'''
              text = text.replace('</style>', css + '\n</style>', 1)

          earth = r'''
<!-- EARTH_ENTRY_ONLY_START -->
<section class="earth-entry-only" aria-label="Erdekugel">
  <div class="earth-entry-globe" aria-hidden="true"></div>
</section>
<!-- EARTH_ENTRY_ONLY_END -->
'''
          if '<body>' not in text:
              raise SystemExit('Body tag not found; no change made.')
          text = text.replace('<body>', '<body>\n' + earth, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add only Earth entry block at top"
          git push
