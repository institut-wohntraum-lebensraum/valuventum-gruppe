      <div class="continent"><strong>🌍 Europa</strong><small>7,434 Bio. Valu / Jahr</small></div>
      <div class="continent"><strong>🌎 Nordamerika</strong><small>7,434 Bio. Valu / Jahr</small></div>
      <div class="continent"><strong>🌎 Südamerika</strong><small>7,434 Bio. Valu / Jahr</small></div>
      <div class="continent"><strong>🌏 Australien/Ozeanien</strong><small>7,434 Bio. Valu / Jahr</small></div>
      <div class="continent"><strong>❄️ Antarktika / globale Aufgaben</strong><small>7,434 Bio. Valu / Jahr</small></div>
    </div>

    <div class="planner">
      <div class="panel">
        <h3 data-t="plannerTitle"></h3>
        <p class="impact-note" data-t="plannerLead"></p>
        <div class="row">
          <label><span data-t="public"></span><input id="vvbd-public" type="range" min="0" max="80" step="1" value="40"><small data-t="publicHint"></small></label>
          <div class="pct"><span id="vvbd-public-pct">40</span> %</div>
        </div>
        <div class="row">
          <label><span data-t="agri"></span><input id="vvbd-agri" type="range" min="0" max="80" step="1" value="25"><small data-t="agriHint"></small></label>
          <div class="pct"><span id="vvbd-agri-pct">25</span> %</div>
        </div>
        <div class="row">
          <label><span data-t="health"></span><input id="vvbd-health" type="range" min="0" max="80" step="1" value="20"><small data-t="healthHint"></small></label>
          <div class="pct"><span id="vvbd-health-pct">20</span> %</div>
        </div>
        <div class="row">
          <label><span data-t="education"></span><input id="vvbd-education" type="range" min="0" max="80" step="1" value="10"><small data-t="educationHint"></small></label>
          <div class="pct"><span id="vvbd-education-pct">10</span> %</div>
        </div>
        <div class="amounts" aria-live="polite">
          <div class="amount"><span data-t="globalAllocated"></span><b id="vvbd-global"></b></div>
          <div class="amount"><span data-t="continentAllocated"></span><b id="vvbd-continent"></b></div>
          <div class="amount"><span data-t="reserveLabel"></span><b id="vvbd-reserve"></b></div>
        </div>
      </div>
      <div class="panel lightbox">
        <div>
          <div id="vvbd-light" class="light" aria-label="Budgetampel"></div>
          <div id="vvbd-status" class="status"></div>
          <p id="vvbd-status-copy" class="statuscopy"></p>
          <div class="reserve"><span data-t="ampelMeaning"></span></div>
        </div>
      </div>
    </div>

    <h3 class="impact-title" data-t="impactTitle"></h3>
    <p class="impact-note" data-t="impactLead"></p>
    <div class="impact">
      <article><strong data-t="impactHumanH"></strong><p data-t="impactHumanP"></p></article>
      <article><strong data-t="impactAgriH"></strong><p data-t="impactAgriP"></p></article>
      <article><strong data-t="impactHealthH"></strong><p data-t="impactHealthP"></p></article>
      <article><strong data-t="impactEduH"></strong><p data-t="impactEduP"></p></article>
    </div>
    <div class="note"><strong data-t="importantH"></strong> <span data-t="importantP"></span></div>
  </div>`;

  const copy={
    de:{
      eye:'MODELLVERTEILUNG · 52,04 BILLIONEN VALU · 7 KONTINENTE',title:'Was nach dem Grundeinkommen für die Gemeinschaft bleibt.',lead:'In dieser VALUVENTUM®-Szenariorechnung bleiben nach 147,96 Billionen Valu Grundeinkommen 52,04 Billionen Valu pro Jahr. Diese werden gleichmäßig auf sieben Kontinente beziehungsweise globale Aufgaben verteilt. Die Verwendung darunter ist eine veränderbare Beispielverteilung.',flow:'10-%-Gemeinschaftstopf',basic:'Grundeinkommen weltweit',rest:'Rest für Gemeinschaftsaufgaben',perContinent:'Bei 7 gleichen Anteilen',transaction:'einheitlicher Transaktionsbeitrag im Modell',incomeTax:'Einkommensteuer im Basismodell',vatBase:'Mehrwert-/Produktsteuer im Basismodell',continentsTitle:'Sieben gleiche Jahresbudgets',plannerTitle:'Verteilung selbst einstellen',plannerLead:'Die vier Bereiche sind ein Startvorschlag. Verschiebe die Regler und beobachte sofort Budget, Reserve und Ampel.',public:'Öffentliche Aufgaben / Steuerersatz',publicHint:'Infrastruktur, Sicherheit, Feuerwehr, Verwaltung und weitere Gemeinschaftsaufgaben.',agri:'Gesunde Landwirtschaft',agriHint:'Bodenaufbau, schadstoffärmere Produktion, Natursaatgut sowie mechanische und solare Agrartechnik.',health:'Gesundheitssystem',healthHint:'Versorgung, Prävention, Pflege, Personal und notwendige Gesundheitsinfrastruktur.',education:'Bildung & Forschung',educationHint:'Schulen, Ausbildung, Weiterbildung, Forschung und frei zugängliches Wissen.',globalAllocated:'Global verplant',continentAllocated:'Je Kontinent verplant',reserveLabel:'Verbleibende Reserve',ampelMeaning:'Die Ampel bewertet nur, ob diese gewählte Modellverteilung innerhalb der 52,04 Billionen Valu bleibt.',impactTitle:'Heilwirkung im übertragenen Sinn · Modellziel',impactLead:'Gemeint ist die mögliche gesellschaftliche und gesundheitliche Wirkung der vorgesehenen Struktur – keine medizinische Heilzusage.',impactHumanH:'👤 Mensch',impactHumanP:'0 % Einkommensteuer im Basismodell lässt den verdienten Arbeitslohn beim Menschen; das Grundeinkommen bleibt davon getrennt.',impactAgriH:'🌱 Boden & Ernährung',impactAgriP:'Investitionen in gesündere Böden und schadstoffärmere Landwirtschaft sollen Lebensmittelqualität, Bodenleben und langfristige Versorgung stärken.',impactHealthH:'❤️ Gesundheit',impactHealthP:'Ein eigener Budgetanteil kann Prävention, medizinische Versorgung, Pflege und erreichbare Gesundheitsleistungen finanzieren.',impactEduH:'🎓 Bildung',impactEduP:'Bildung und Forschung sollen langfristig Selbstständigkeit, Innovation und gesellschaftliche Teilhabe stärken.',importantH:'Wichtige Abgrenzung:',importantP:'Die 52,04-Billionen-Verteilung ist eine VALUVENTUM®-Szenariorechnung. Für diese Darstellung wird ein Modellfluss von 2,0 Billiarden Valu als Rechengröße angesetzt. Der McKinsey-Quellenwert von 2,0 Billiarden USD ist davon als externe USD-Angabe getrennt; die Ampel beweist nicht, dass reale Staatsausgaben aller Länder vollständig gedeckt sind.',green:'GRÜN · Verteilung mit Reserve',greenCopy:'Die gewählten Bereiche bleiben innerhalb des Modellbudgets und lassen mindestens 5 % Reserve.',yellow:'GELB · Kaum Reserve',yellowCopy:'Die Verteilung bleibt noch im Modellbudget, lässt aber weniger als 5 % Reserve.',red:'ROT · Budget überschritten',redCopy:'Die gewählten Anteile überschreiten zusammen 100 % des verfügbaren Modellbudgets.'
    },
    en:{
      eye:'MODEL DISTRIBUTION · 52.04 TRILLION VALU · 7 CONTINENTS',title:'What remains for the community after basic income.',lead:'In this VALUVENTUM® scenario calculation, 52.04 trillion Valu per year remain after 147.96 trillion Valu of basic income. They are divided equally among seven continents or global tasks. The allocation below is an adjustable example.',flow:'10% community pool',basic:'Worldwide basic income',rest:'Remainder for community tasks',perContinent:'With 7 equal shares',transaction:'uniform transaction contribution in the model',incomeTax:'income tax in the base model',vatBase:'VAT/product tax in the base model',continentsTitle:'Seven equal annual budgets',plannerTitle:'Adjust the allocation yourself',plannerLead:'The four areas are a starting proposal. Move the sliders and immediately see budget, reserve and traffic light.',public:'Public tasks / tax replacement',publicHint:'Infrastructure, security, fire services, administration and other community tasks.',agri:'Healthy agriculture',agriHint:'Soil restoration, lower-pollutant production, natural seed and mechanical and solar agricultural technology.',health:'Health system',healthHint:'Care, prevention, nursing, staff and necessary health infrastructure.',education:'Education & research',educationHint:'Schools, training, continuing education, research and accessible knowledge.',globalAllocated:'Allocated globally',continentAllocated:'Allocated per continent',reserveLabel:'Remaining reserve',ampelMeaning:'The traffic light only assesses whether the chosen model allocation stays within the 52.04 trillion Valu pool.',impactTitle:'Healing effect in a broader sense · model objective',impactLead:'This means the possible social and health-related effect of the proposed structure, not a medical promise of healing.',impactHumanH:'👤 People',impactHumanP:'0% income tax in the base model leaves earned wages with the person; basic income remains separate.',impactAgriH:'🌱 Soil & food',impactAgriP:'Investment in healthier soils and lower-pollutant agriculture is intended to strengthen food quality, soil life and long-term supply.',impactHealthH:'❤️ Health',impactHealthP:'A dedicated budget share can finance prevention, medical care, nursing and accessible health services.',impactEduH:'🎓 Education',impactEduP:'Education and research are intended to strengthen independence, innovation and social participation over the long term.',importantH:'Important distinction:',importantP:'The 52.04-trillion distribution is a VALUVENTUM® scenario calculation. For this display, a model flow of 2.0 quadrillion Valu is used as the calculation quantity. McKinsey’s external source figure of USD 2.0 quadrillion remains a separate USD figure; the traffic light does not prove that all real government spending is fully covered.',green:'GREEN · Allocation with reserve',greenCopy:'The selected areas remain within the model budget and leave at least 5% reserve.',yellow:'YELLOW · Little reserve',yellowCopy:'The allocation remains within the model budget but leaves less than 5% reserve.',red:'RED · Budget exceeded',redCopy:'The selected shares together exceed 100% of the available model budget.'
    },
    es:{
