name: Fix VALUVENTUM step numbering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valuventum-budget-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct step labels only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'SCHRITT 1 · HAUSHALT ZUM SELBERRECHNEN',
              'HAUSHALTSVERGLEICH · ZUM SELBERRECHNEN'
          )
          text = text.replace(
              'SCHRITT 2 · VALUVENTUM® · GRUNDEINKOMMEN',
              'SCHRITT 1 · VALUVENTUM® · GRUNDEINKOMMEN'
          )

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Set VALUVENTUM basic income as step 1"
          git push
